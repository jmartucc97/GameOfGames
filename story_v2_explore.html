<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Story</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f0f12;
    color: #e8e8ea;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 20px 40px;
    line-height: 1.6;
    position: relative;
  }
  /* Background image layer - tiled texture per scene */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: var(--bg-image, none);
    background-repeat: repeat;
    background-size: 48px 48px;  /* smaller tile = more ambient, less visually competing */
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    opacity: var(--bg-opacity, 0);
    z-index: -2;
    transition: opacity 0.5s ease;
  }
  /* Dark vignette/overlay for readability */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, rgba(15,15,18,0.65) 0%, rgba(15,15,18,0.80) 100%);
    pointer-events: none;
    z-index: -1;
    opacity: var(--bg-opacity, 0);
    transition: opacity 0.5s ease;
  }
  /* Scene text gets a slight backing so it stays readable on textured bg */
  .scene-text {
    background: rgba(15, 15, 18, 0.55);
    backdrop-filter: blur(2px);
    padding: 12px 16px;
    border-radius: 8px;
  }
  .container { width: 100%; max-width: 600px; flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .inventory {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-bottom: 16px;
    animation: fadeIn 0.4s ease;
  }
  .inventory-label {
    font-size: 0.7rem;
    color: #5a5a62;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-right: 4px;
  }
  .inv-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 999px;
    background: #1e1e26;
    border: 1px solid #2e2e38;
    font-size: 0.78rem;
    color: #c8c8d0;
    line-height: 1.2;
    white-space: nowrap;
  }
  .inv-chip .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #888;
  }
  .inv-chip.tool   { border-color: #4a6a8a; }   .inv-chip.tool .dot   { background: #6a9adb; }
  .inv-chip.doc    { border-color: #8a7a3a; }   .inv-chip.doc .dot    { background: #e0c870; }
  .inv-chip.food   { border-color: #6a8a3a; }   .inv-chip.food .dot   { background: #a8d870; }
  .inv-chip.gift   { border-color: #8a3a6a; }   .inv-chip.gift .dot   { background: #d870aa; }
  .inv-chip.weapon { border-color: #8a4a3a; }   .inv-chip.weapon .dot { background: #d8704a; }
  .inv-chip.misc   { border-color: #555;    }   .inv-chip.misc .dot   { background: #aaa; }

  /* ============= EXPLORE MODE (tap-to-walk) ============= */
  .explore-wrap {
    width: 100%;
    max-width: 396px;
    margin: 0 auto 16px;
    background: #0c0c10;
    border-radius: 8px;
    padding: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    animation: fadeIn 0.4s ease;
  }
  .explore-room {
    position: relative;
    width: 100%;
    aspect-ratio: 11 / 14;
    background: #1a1610;
    background-image:
      linear-gradient(0deg, transparent 49%, rgba(0,0,0,0.18) 50%, transparent 51%),
      linear-gradient(90deg, transparent 49%, rgba(0,0,0,0.18) 50%, transparent 51%);
    background-size: 9.09% 7.14%;
    border: 4px solid #3a2a18;
    border-radius: 4px;
    overflow: hidden;
    image-rendering: pixelated;
    touch-action: manipulation;
    cursor: pointer;
  }
  .explore-wall {
    position: absolute;
    background: #3a2a18;
    background-image:
      linear-gradient(45deg, rgba(0,0,0,0.25) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.25) 75%),
      linear-gradient(45deg, rgba(0,0,0,0.25) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.25) 75%);
    background-size: 12px 12px;
    background-position: 0 0, 6px 6px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
  }
  .explore-floor-tile {
    position: absolute;
    background: rgba(80, 60, 40, 0.18);
  }
  .explore-entity {
    position: absolute;
    image-rendering: pixelated;
    object-fit: contain;
    pointer-events: none;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.4));
  }
  .explore-entity.searched {
    opacity: 0.55;
  }
  .explore-entity-hit {
    position: absolute;
    background: transparent;
    cursor: pointer;
    z-index: 5;
  }
  .explore-entity-hit:active {
    background: rgba(255, 220, 120, 0.18);
  }
  .explore-player {
    position: absolute;
    image-rendering: pixelated;
    pointer-events: none;
    transition: left 0.18s linear, top 0.18s linear;
    z-index: 10;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.6));
  }
  .explore-door {
    position: absolute;
    background: linear-gradient(180deg, #4a3220 0%, #2a1810 100%);
    border: 2px solid #5a3a22;
    border-radius: 2px;
    box-shadow: 0 0 12px rgba(120, 80, 40, 0.6);
    z-index: 1;
  }
  .explore-hint {
    text-align: center;
    color: #8a7a6a;
    font-size: 13px;
    margin-top: 8px;
    font-style: italic;
  }
  .explore-label {
    text-align: center;
    color: #c9b08a;
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .explore-tap-pulse {
    position: absolute;
    border: 2px solid rgba(220, 180, 100, 0.7);
    border-radius: 50%;
    pointer-events: none;
    animation: tapPulse 0.5s ease-out forwards;
    z-index: 8;
  }
  @keyframes tapPulse {
    0%   { transform: scale(0.4); opacity: 1; }
    100% { transform: scale(1.6); opacity: 0; }
  }

  /* ============= PIT GAUNTLET UI ============= */
  .pit-status {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
    padding: 10px 14px;
    background: #14141a;
    border: 1px solid #2a2a32;
    border-radius: 8px;
    animation: fadeIn 0.4s ease;
  }
  .pit-hp-block { flex: 1; }
  .pit-hp-label {
    font-size: 0.62rem;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-bottom: 4px;
  }
  .pit-hp-bar {
    display: flex;
    gap: 4px;
    height: 18px;
  }
  .pit-hp-cell {
    flex: 1;
    background: #2a2a32;
    border-radius: 2px;
    transition: background 0.3s ease, transform 0.2s ease;
  }
  .pit-hp-cell.filled { background: linear-gradient(180deg, #d83a3a, #8a2222); box-shadow: 0 0 4px rgba(216,58,58,0.5); }
  .pit-hp-cell.draining {
    animation: hpDrain 0.6s ease;
  }
  @keyframes hpDrain {
    0%   { background: #ff8a3a; transform: scaleY(1.4); }
    50%  { background: #d83a3a; }
    100% { background: #2a2a32; transform: scaleY(1); }
  }

  .pit-ammo {
    display: flex;
    gap: 4px;
    flex-direction: column;
    align-items: flex-end;
    font-size: 0.7rem;
  }
  .pit-ammo-row { display: flex; align-items: center; gap: 6px; color: #aaa; }
  .pit-ammo-dots { display: flex; gap: 2px; }
  .pit-ammo-dot {
    width: 8px; height: 8px;
    background: #d8a050;
    border-radius: 50%;
    transition: opacity 0.4s ease, transform 0.3s ease;
  }
  .pit-ammo-dot.spent { opacity: 0.15; background: #555; }
  .pit-ammo-dot.firing { animation: dotFire 0.5s ease; }
  @keyframes dotFire {
    0%   { transform: scale(1.8); background: #fff; box-shadow: 0 0 12px #ffd070; }
    100% { transform: scale(1); background: #555; opacity: 0.15; }
  }

  .pit-timer {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 8px;
    background: #1a1a22;
    z-index: 100;
    overflow: hidden;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }
  .pit-timer-fill {
    height: 100%;
    background: linear-gradient(90deg, #6acc6a, #d8a050, #d83a3a);
    transition: width linear;
  }

  .screen-shake { animation: shake 0.45s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    15% { transform: translateX(-6px); }
    30% { transform: translateX(6px); }
    45% { transform: translateX(-4px); }
    60% { transform: translateX(4px); }
    75% { transform: translateX(-2px); }
  }
  .damage-flash {
    position: fixed; inset: 0;
    background: rgba(216, 58, 58, 0.35);
    pointer-events: none;
    z-index: 1000;
    animation: damageFlash 0.5s ease;
  }
  @keyframes damageFlash {
    0%   { opacity: 1; }
    100% { opacity: 0; }
  }

  /* Demon HP bar overlay on sprite */
  .demon-wrap {
    position: relative;
    display: block;
    margin: 0 auto;
    width: 100%;
  }
  .demon-hp {
    display: flex;
    gap: 4px;
    justify-content: center;
    margin-top: -6px;
    margin-bottom: 8px;
  }
  .demon-hp-cell {
    width: 40px;
    height: 12px;
    background: #2a2a32;
    border: 1px solid #444;
    border-radius: 2px;
    transition: background 0.3s ease;
  }
  .demon-hp-cell.filled {
    background: linear-gradient(180deg, #b03050, #6a1820);
    box-shadow: 0 0 4px rgba(176, 48, 80, 0.6);
  }
  .demon-hp-cell.draining { animation: demonHpDrain 0.6s ease; }
  @keyframes demonHpDrain {
    0%   { background: #ffeb70; transform: scaleY(1.4); }
    50%  { background: #d8a050; }
    100% { background: #2a2a32; transform: scaleY(1); }
  }

  .demon-hit { animation: demonHitFlash 0.4s ease; }
  @keyframes demonHitFlash {
    0%, 100% { filter: none; }
    20% { filter: brightness(3) saturate(0) drop-shadow(0 0 8px #fff); }
    50% { filter: brightness(2) saturate(2); }
  }

  /* Spent item button — grayed out, still clickable */
  .choice.spent {
    opacity: 0.4;
    border-color: #3a1818 !important;
    color: #884444 !important;
    text-decoration: line-through;
    background: #1a0e0e !important;
    cursor: not-allowed;
  }
  .choice.spent::after {
    content: " — empty";
    color: #884444;
    font-size: 0.75em;
    text-decoration: none;
    margin-left: 4px;
  }

  .ammo-toast {
    position: fixed;
    top: 30%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(40, 10, 10, 0.95);
    color: #ff9090;
    border: 1px solid #6a2020;
    padding: 10px 24px;
    border-radius: 6px;
    font-size: 1.1rem;
    font-weight: bold;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    z-index: 2000;
    pointer-events: none;
    animation: ammoToast 1.1s ease;
  }
  @keyframes ammoToast {
    0%   { opacity: 0; transform: translate(-50%, -40%); }
    15%  { opacity: 1; transform: translate(-50%, -50%); }
    85%  { opacity: 1; transform: translate(-50%, -50%); }
    100% { opacity: 0; transform: translate(-50%, -60%); }
  }

  .pixel-art {
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    width: 100%;
    max-width: 520px;
    height: auto;
    display: block;
    margin: 0 auto 24px;
    background: #16161c;
    border-radius: 8px;
    padding: 16px;
    object-fit: contain;
    animation: fadeIn 0.4s ease;
  }
  /* Samara: eerie sway + occasional twitch */
  .pixel-art.samara-anim {
    animation: fadeIn 0.4s ease, samaraSway 3.6s ease-in-out infinite, samaraTwitch 7s infinite;
    transform-origin: center bottom;
  }
  @keyframes samaraSway {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25%      { transform: translateY(-2px) rotate(-0.6deg); }
    50%      { transform: translateY(0) rotate(0deg); }
    75%      { transform: translateY(-2px) rotate(0.6deg); }
  }
  @keyframes samaraTwitch {
    0%, 92%, 100% { filter: none; }
    93%           { transform: translate(2px, 0); filter: hue-rotate(15deg); }
    94%           { transform: translate(-3px, 1px); }
    95%, 96%      { transform: translate(2px, -1px); filter: brightness(1.15); }
    97%           { transform: translate(0); filter: none; }
  }
  .scene-text {
    font-size: 1.1rem;
    margin-bottom: 28px;
    white-space: pre-wrap;
    animation: fadeIn 0.4s ease;
  }
  .choices { display: flex; flex-direction: column; gap: 12px; animation: fadeIn 0.4s ease 0.1s both; }
  .choice {
    background: #1c1c22;
    border: 1px solid #2a2a32;
    color: #e8e8ea;
    padding: 16px 18px;
    border-radius: 12px;
    font-size: 1rem;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    transition: background 0.15s, transform 0.05s;
    line-height: 1.4;
  }
  .choice:hover { background: #25252e; }
  .choice:active { transform: scale(0.98); background: #2e2e38; }
  .ending-label {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #888;
    margin-bottom: 16px;
    text-align: center;
  }
  .ending-label.win { color: #5aaa4a; }
  .ending-label.bad { color: #c03a3a; }
  .restart {
    background: #e8e8ea;
    color: #0f0f12;
    border: none;
    padding: 16px 24px;
    border-radius: 12px;
    font-size: 1rem;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    margin-top: 16px;
    width: 100%;
  }
  .restart:active { transform: scale(0.98); }
  .text-input {
    background: #1c1c22;
    border: 1px solid #2a2a32;
    color: #e8e8ea;
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 1rem;
    font-family: inherit;
    width: 100%;
    margin-bottom: 12px;
  }
  .text-input:focus { outline: none; border-color: #4a4a52; }
  .submit-button {
    background: #e8e8ea;
    color: #0f0f12;
    border: none;
    padding: 14px 20px;
    border-radius: 12px;
    font-size: 1rem;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
  }
  .submit-button:active { transform: scale(0.98); }
  .input-error {
    color: #c03a3a;
    font-size: 0.9rem;
    margin-top: 12px;
    text-align: center;
    min-height: 1.2em;
  }
  .restart-link {
    display: block;
    text-align: center;
    margin-top: 28px;
    font-size: 0.78rem;
    color: #444;
    text-decoration: underline;
    cursor: pointer;
  }
  .restart-link:hover { color: #777; }
  .stats-block {
    background: #16161c;
    border: 1px solid #2a2a32;
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 16px;
    animation: fadeIn 0.4s ease 0.2s both;
  }
  .stats-title {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #6a6a72;
    margin-bottom: 10px;
    text-align: center;
  }
  .stats-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.92rem;
    color: #c8c8ca;
    padding: 4px 0;
  }
  .stats-row span:first-child { color: #888; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="container">
  <div id="app"></div>
</div>

function pileChoices(pileItems, returnScene) {
  const choices = [];
  // Take each item (auto-swaps - clears other items in pile, sets this one)
  pileItems.forEach(item => {
    const set = {};
    pileItems.forEach(other => { set[other.flag] = (other.id === item.id); });
    choices.push({
      text: `Take the ${item.label}`,
      next: returnScene === "self" ? null : returnScene,
      set: set,
      unless: [item.flag]
    });
  });
  // Put back current item
  pileItems.forEach(item => {
    const set = {};
    set[item.flag] = false;
    choices.push({
      text: `Put back the ${item.label}`,
      set: set,
      requires: [item.flag]
    });
  });
  return choices;
}

function artToDataUrl(artLines) {
  if (!artLines || !artLines.length) return null;
  const width = Math.max(...artLines.map(l => l.length));
  const height = artLines.length;
  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext("2d");
  for (let y = 0; y < height; y++) {
    const line = artLines[y];
    for (let x = 0; x < line.length; x++) {
      const ch = line[x];
      const color = PALETTE[ch];
      if (color && color !== "transparent") {
        ctx.fillStyle = color;
        ctx.fillRect(x, y, 1, 1);
      }
    }
  }
  return canvas.toDataURL();
}

function buildPitStatus() {
  if (!state.pit_initiated) return "";
  const hp = state.pit_hp;
  const max = state.pit_hp_max;
  let cells = "";
  for (let i = 0; i < max; i++) {
    cells += `<div class="pit-hp-cell ${i < hp ? 'filled' : ''}"></div>`;
  }
  // Ammo summary chips (compact)
  const ammoRows = [];
  if (state.pit_kalash_uses > 0) ammoRows.push({ name: "Kalash", uses: state.pit_kalash_uses, max: 8 });
  if (state.pit_backup) ammoRows.push({ name: backupLabel(state.pit_backup), uses: state.pit_backup_uses, max: 6 });
  if (state.pit_support) ammoRows.push({ name: supportLabel(state.pit_support), uses: state.pit_support_uses, max: 2 });
  if (state.pit_special && state.pit_special_uses > 0) ammoRows.push({ name: specialLabel(state.pit_special), uses: state.pit_special_uses, max: 1 });
  if (state.pit_wildcard && state.pit_wildcard_uses > 0) ammoRows.push({ name: wildcardLabel(state.pit_wildcard), uses: state.pit_wildcard_uses, max: 1 });
  const ammoHtml = ammoRows.map(r => {
    let dots = "";
    for (let i = 0; i < r.max; i++) {
      dots += `<div class="pit-ammo-dot ${i >= r.uses ? 'spent' : ''}"></div>`;
    }
    return `<div class="pit-ammo-row"><span>${r.name}</span><span class="pit-ammo-dots">${dots}</span></div>`;
  }).join("");
  return `<div class="pit-status">
    <div class="pit-hp-block">
      <div class="pit-hp-label">Vitals — Hit Points</div>
      <div class="pit-hp-bar" id="pitHpBar">${cells}</div>
    </div>
    <div class="pit-ammo">${ammoHtml}</div>
  </div>`;
}

function backupLabel(key) {
  return { chainsaw: "Chainsaw", whip: "Whip", broadsword: "Broadsword" }[key] || key;
}
function supportLabel(key) {
  return { suncruisers: "Suncruisers", whiskey: "Whiskey", plumwine: "Plum Wine" }[key] || key;
}
function specialLabel(key) {
  return { speaker: "Speaker", catnip_banana: "Catnip Banana", holy_water: "Holy Water" }[key] || key;
}
function wildcardLabel(key) {
  return { election: "2024 Results", sowell: "Basic Economics", norbit: "Norbit Blu-Ray" }[key] || key;
}

// ---- Background music control ----
let _bgmAudio = null;
let _bgmCurrentSrc = null;

function playMusic(src, volume) {
  if (volume == null) volume = 0.35;
  // If already playing this src, leave it alone
  if (_bgmAudio && _bgmCurrentSrc === src && !_bgmAudio.paused) return;
  stopMusic();
  _bgmAudio = new Audio(src);
  _bgmAudio.loop = true;
  _bgmAudio.volume = volume;
  _bgmCurrentSrc = src;
  // Browsers block autoplay until a user gesture; play() returns a Promise that may reject
  const p = _bgmAudio.play();
  if (p && typeof p.catch === "function") p.catch(() => { /* swallow autoplay errors */ });
}

function stopMusic() {
  if (_bgmAudio) {
    try { _bgmAudio.pause(); } catch {}
    _bgmAudio = null;
    _bgmCurrentSrc = null;
  }
}

function playSfx(name) {
  // Plays a short sound effect. Uses tiny WebAudio synth tones for now (no asset files).
  try {
    const ctx = window._audioCtx || (window._audioCtx = new (window.AudioContext || window.webkitAudioContext)());
    if (ctx.state === "suspended") ctx.resume();
    const presets = {
      gunshot: { freq: 80,  type: "square",   dur: 0.12, decay: 0.18 },
      chainsaw:{ freq: 140, type: "sawtooth", dur: 0.5,  decay: 0.6  },
      shot:    { freq: 200, type: "square",   dur: 0.10, decay: 0.15 },
      hit:     { freq: 60,  type: "sine",     dur: 0.15, decay: 0.25 },
      ow:      { freq: 320, type: "sawtooth", dur: 0.18, decay: 0.3  },
      drink:   { freq: 540, type: "sine",     dur: 0.25, decay: 0.35 },
      magic:   { freq: 880, type: "triangle", dur: 0.3,  decay: 0.5  },
      explode: { freq: 50,  type: "square",   dur: 0.4,  decay: 0.6  },
    };
    const p = presets[name] || presets.shot;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = p.type;
    osc.frequency.setValueAtTime(p.freq, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(p.freq * 0.4, ctx.currentTime + p.dur);
    gain.gain.setValueAtTime(0.35, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + p.decay);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + p.decay);
  } catch (e) {
    // sound failures are non-fatal
  }
}

function showAmmoToast(choice) {
  // Briefly show a toast message reminding the player they're out of that resource
  const existing = document.querySelector(".ammo-toast");
  if (existing) existing.remove();
  const toast = document.createElement("div");
  toast.className = "ammo-toast";
  toast.textContent = "Out of ammo";
  document.body.appendChild(toast);
  // Small screen shake but no flash, no damage
  document.body.classList.add("screen-shake");
  setTimeout(() => document.body.classList.remove("screen-shake"), 250);
  // Audio cue: empty-click dry sound
  playSfx("hit");
  setTimeout(() => toast.remove(), 1100);
}

function flashDamage() {
  const flash = document.createElement("div");
  flash.className = "damage-flash";
  document.body.appendChild(flash);
  setTimeout(() => flash.remove(), 500);

function buildInventory() {
  if (state.pit_initiated) return "";  // pit gauntlet uses pit-status instead
  const items = [];
  if (state.has_flashlight)  items.push({ label: "flashlight",     cat: "tool" });
  if (state.has_ssn)         items.push({ label: "SSN card",       cat: "doc" });
  if (state.has_passport)    items.push({ label: "passport",       cat: "doc" });
  if (state.has_speaker)     items.push({ label: "speaker",        cat: "tool" });
  if (state.has_note)        items.push({ label: "scrap of paper", cat: "doc" });
  if (state.has_zynns)       items.push({ label: "Zynns",          cat: "misc" });
  if (state.has_plums)       items.push({ label: "plums",          cat: "food" });
  if (state.has_mtg_deck)    items.push({ label: "MtG deck",       cat: "misc" });
  if (state.has_charger)     items.push({ label: "USB charger",    cat: "tool" });
  if (state.has_kalashnikov) items.push({ label: "Kalashnikov",    cat: "weapon" });
  if (state.has_bananas)     items.push({ label: "10²¹ bananas",   cat: "food" });
  if (state.has_tube)        items.push({ label: "treat tube",     cat: "gift" });
  if (state.has_hard_treats) items.push({ label: "hard treats",    cat: "gift" });

  if (!items.length) return "";
  const chips = items.map(i =>

  ).join("");

}

function isChoiceVisible(c) {
  if (c.requires) for (const k of c.requires) if (!state[k]) return false;
  if (c.unless) for (const k of c.unless) if (state[k]) return false;
  if (c.requires_count) {
    for (const k of c.requires_count) if (!(state[k] > 0)) return false;
  }
  // For fight scenes: skip choices already tried in current fight
  if (c.id && state.pit_fight_wrong && state.pit_fight_wrong.includes(c.id)) return false;
  return true;
}

function resolveText(t) {
  return typeof t === "function" ? t(state) : t;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

// ============================================================
// EXPLORE MODE — tap-to-walk rooms
// ============================================================
// Room dims: ROOM_W cols × ROOM_H rows of tiles.
// Layouts use characters: '#' = wall, '.' = floor, 'D' = door (exit),
// numbered entities (1, 2, 3, R) get their interactivity from the room's
// entities[] map keyed by the same char.
const ROOM_W = 11;
const ROOM_H = 14;

const EXPLORE_ROOMS = {
  storage: {
    label: "Storage Room",
    hint: "Tap a pile to rummage. Tap the door to leave.",
    layout: [
      "###########",
      "#.........#",
      "#..3......#",   // pile 3 back-left
      "#.........#",
      "#......R..#",   // rasputin tile (visible after 2 deaths)
      "#.........#",
      "#....2....#",   // pile 2 middle
      "#.........#",
      "#.........#",
      "#..1......#",   // pile 1 near entrance
      "#.........#",
      "#.........#",
      "#.........#",
      "####D######",   // exit door south
    ],
    // Where the player appears when entering this room.
    spawn: { x: 5, y: 12 },
    // Entities keyed by layout char.
    // sprite: name in SPRITES table to render.
    // scene: dialogue scene to trigger when player reaches and interacts.
    // visible: optional state-fn — if returns false, entity is hidden.
    // searched_flag: optional state key — when set, entity renders dimmed.
    entities: {
      "1": {
        sprite: "pile1_junk",
        scene: "scene_pile_1",
        size: 1.8,   // tiles wide/tall for the sprite display
        searched_flag: null  // pile_1 is always available to revisit
      },
      "2": {
        sprite: "pile2_junk",
        scene: "scene_pile_2",
        size: 1.8,
        searched_flag: null
      },
      "3": {
        sprite: "pile3_junk",
        scene: "scene_pile_3",
        size: 1.8,
        searched_flag: null
      },
      "R": {
        sprite: "rasputin",
        scene: "scene_rasputin",
        size: 1.5,
        visible: (s) => !!s._rasputin_available
      },
      "D": {
        // Door is rendered separately (not an entity), but we include it for symmetry.
        // The room renderer handles 'D' tiles as exit doors.
      }
    },
    // Where the player exits to when stepping on the door tile.
    exit_to: "scene_test"
  }
};

// Per-room cached player position so re-entering the room doesn't reset position.
// We default to room.spawn unless state._explore_pos[roomId] has been saved.
function getExploreState(roomId) {
  if (!state._explore_pos) state._explore_pos = {};
  return state._explore_pos[roomId];
}
function saveExploreState(roomId, pos) {
  if (!state._explore_pos) state._explore_pos = {};
  state._explore_pos[roomId] = { x: pos.x, y: pos.y };
}

// BFS pathfinding over a tile grid. Returns array of {x,y} from start (exclusive) to goal (inclusive).
// Returns null if unreachable.
function findPath(grid, start, goal, blockedSet) {
  if (start.x === goal.x && start.y === goal.y) return [];
  const W = grid[0].length;
  const H = grid.length;
  const key = (x, y) => y * W + x;
  const visited = new Set([key(start.x, start.y)]);
  const queue = [{ x: start.x, y: start.y, path: [] }];
  while (queue.length) {
    const cur = queue.shift();
    for (const [dx, dy] of [[0,-1],[1,0],[0,1],[-1,0]]) {
      const nx = cur.x + dx, ny = cur.y + dy;
      if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
      if (visited.has(key(nx, ny))) continue;
      const tile = grid[ny][nx];
      // Goal tile is always reachable (we may want to walk onto an entity tile's neighbor)
      if (!(nx === goal.x && ny === goal.y)) {
        if (tile === '#') continue;
        if (blockedSet && blockedSet.has(key(nx, ny))) continue;
      }
      const newPath = cur.path.concat([{x: nx, y: ny}]);
      if (nx === goal.x && ny === goal.y) return newPath;
      visited.add(key(nx, ny));
      queue.push({ x: nx, y: ny, path: newPath });
    }
  }
  return null;
}

// Find the closest walkable tile adjacent to (tx, ty). Used so the player
// walks UP TO an entity rather than onto it.
function findApproachTile(grid, from, target, blockedSet) {
  const W = grid[0].length;
  const H = grid.length;
  const candidates = [];
  for (const [dx, dy] of [[0,-1],[1,0],[0,1],[-1,0]]) {
    const nx = target.x + dx, ny = target.y + dy;
    if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
    if (grid[ny][nx] === '#') continue;
    const k = ny * W + nx;
    if (blockedSet && blockedSet.has(k)) continue;
    // Pathfind from `from` to this candidate
    const path = findPath(grid, from, {x: nx, y: ny}, blockedSet);
    if (path !== null) candidates.push({ x: nx, y: ny, dist: path.length });
  }
  if (!candidates.length) return null;
  candidates.sort((a, b) => a.dist - b.dist);
  return { x: candidates[0].x, y: candidates[0].y };
}

let _exploreState = null;  // Holds active room state while in explore mode.
let _exploreWalkTimer = null;

function renderExplore(sceneId) {
  const scene = SCENES[sceneId];
  const roomId = scene.explore_room;
  const room = EXPLORE_ROOMS[roomId];
  if (!room) {
    app.innerHTML = `<div class="scene-text">Error: explore room "${roomId}" not found.</div>`;
    return;
  }
  // Build entity tile map from the layout
  const grid = room.layout;
  const entityTiles = [];  // [{char, x, y, def}]
  for (let y = 0; y < grid.length; y++) {
    for (let x = 0; x < grid[y].length; x++) {
      const ch = grid[y][x];
      if (ch !== '#' && ch !== '.' && ch !== 'D') {
        const def = room.entities[ch];
        if (!def) continue;
        if (def.visible && !def.visible(state)) continue;
        entityTiles.push({ char: ch, x, y, def });
      }
    }
  }
  // Blocked tile set (entity tiles are blocked, so player walks adjacent)
  const blockedSet = new Set();
  for (const e of entityTiles) blockedSet.add(e.y * ROOM_W + e.x);

  // Player position: saved or spawn
  let playerPos = getExploreState(roomId);
  if (!playerPos) playerPos = { ...room.spawn };
  _exploreState = { roomId, grid, entityTiles, blockedSet, playerPos, room };

  // Compute pixel positions. Use percentage so it scales with viewport.
  const tilePctX = 100 / ROOM_W;
  const tilePctY = 100 / ROOM_H;
  const px = (x) => `${x * tilePctX}%`;
  const py = (y) => `${y * tilePctY}%`;
  const ptw = `${tilePctX}%`;
  const pth = `${tilePctY}%`;

  let html = `<div class="explore-wrap">`;
  html += `<div class="explore-label">${escapeHtml(room.label)}</div>`;
  html += `<div class="explore-room" id="exploreRoom">`;

  // Render door tiles (the southern exit)
  for (let y = 0; y < grid.length; y++) {
    for (let x = 0; x < grid[y].length; x++) {
      if (grid[y][x] === 'D') {
        html += `<div class="explore-door" style="left:${px(x)};top:${py(y)};width:${ptw};height:${pth};" data-exit="1"></div>`;
      }
    }
  }
  // Render walls
  for (let y = 0; y < grid.length; y++) {
    for (let x = 0; x < grid[y].length; x++) {
      if (grid[y][x] === '#') {
        html += `<div class="explore-wall" style="left:${px(x)};top:${py(y)};width:${ptw};height:${pth};"></div>`;
      }
    }
  }
  // Render entities + their hit zones
  for (const e of entityTiles) {
    const spriteUrl = SPRITES[e.def.sprite] || "";
    const size = e.def.size || 1.5;
    // Center-align the entity sprite on its tile
    const offsetX = (size - 1) / 2;
    const isSearched = e.def.searched_flag && state[e.def.searched_flag];
    const cls = isSearched ? "explore-entity searched" : "explore-entity";
    html += `<img class="${cls}" src="${spriteUrl}" style="left:${px(e.x - offsetX)};top:${py(e.y - (size - 1))};width:${size * tilePctX}%;height:${size * tilePctY}%;" alt="">`;
    // Hit box covers the entity's tile (slightly larger for easy tapping on mobile)
    const hitSize = 1.4;
    const hitOffset = (hitSize - 1) / 2;
    html += `<div class="explore-entity-hit" data-entity-x="${e.x}" data-entity-y="${e.y}" data-scene="${e.def.scene}" style="left:${px(e.x - hitOffset)};top:${py(e.y - hitOffset)};width:${hitSize * tilePctX}%;height:${hitSize * tilePctY}%;"></div>`;
  }
  // Render player
  const playerUrl = SPRITES.player_avatar;
  const playerSize = 1.4;
  const pOffsetX = (playerSize - 1) / 2;
  html += `<img class="explore-player" id="explorePlayer" src="${playerUrl}" style="left:${px(playerPos.x - pOffsetX)};top:${py(playerPos.y - (playerSize - 1))};width:${playerSize * tilePctX}%;height:${playerSize * tilePctY}%;" alt="">`;

  html += `</div>`;  // .explore-room
  html += `<div class="explore-hint">${escapeHtml(room.hint || "")}</div>`;
  html += `</div>`;  // .explore-wrap

  app.innerHTML = html;

  // Attach tap handler to the room
  const roomEl = document.getElementById("exploreRoom");
  roomEl.addEventListener("click", (ev) => handleExploreTap(ev, roomEl));
}

function handleExploreTap(ev, roomEl) {
  if (!_exploreState) return;
  if (_exploreWalkTimer) return;  // mid-walk, ignore taps

  const rect = roomEl.getBoundingClientRect();
  const cx = ev.clientX - rect.left;
  const cy = ev.clientY - rect.top;
  const tx = Math.floor(cx / (rect.width / ROOM_W));
  const ty = Math.floor(cy / (rect.height / ROOM_H));

  // Pulse animation at tap point
  const pulse = document.createElement("div");
  pulse.className = "explore-tap-pulse";
  const pulseSize = rect.width / ROOM_W * 0.9;
  pulse.style.left = `${cx - pulseSize/2}px`;
  pulse.style.top = `${cy - pulseSize/2}px`;
  pulse.style.width = `${pulseSize}px`;
  pulse.style.height = `${pulseSize}px`;
  roomEl.appendChild(pulse);
  setTimeout(() => pulse.remove(), 500);

  const { grid, entityTiles, blockedSet, playerPos } = _exploreState;

  // Was an entity tapped?
  const entityTapped = entityTiles.find(e => e.x === tx && e.y === ty);
  if (entityTapped) {
    const approach = findApproachTile(grid, playerPos, {x: tx, y: ty}, blockedSet);
    if (approach) {
      const path = findPath(grid, playerPos, approach, blockedSet);
      if (path !== null) {
        walkPath(path, () => triggerInteraction(entityTapped));
      }
    }
    return;
  }

  // Was the door tapped?
  if (ty >= 0 && ty < grid.length && tx >= 0 && tx < grid[0].length && grid[ty][tx] === 'D') {
    // Find approach tile for the door (the tile above it)
    const approach = findApproachTile(grid, playerPos, {x: tx, y: ty}, blockedSet);
    if (approach) {
      const path = findPath(grid, playerPos, approach, blockedSet);
      if (path !== null) {
        walkPath(path, () => {
          // Step onto the door and exit
          const doorPath = [{x: tx, y: ty}];
          walkPath(doorPath, () => exitRoom());
        });
      }
    }
    return;
  }

  // Else: walk to that floor tile if possible
  if (ty < 0 || ty >= grid.length || tx < 0 || tx >= grid[0].length) return;
  const tile = grid[ty][tx];
  if (tile === '#') return;  // can't walk into walls
  if (blockedSet.has(ty * ROOM_W + tx)) return;
  const path = findPath(grid, playerPos, {x: tx, y: ty}, blockedSet);
  if (path !== null) walkPath(path, null);
}

function walkPath(path, onComplete) {
  if (!path.length) {
    if (onComplete) onComplete();
    return;
  }
  const playerEl = document.getElementById("explorePlayer");
  let i = 0;
  const stepDur = 180;
  _exploreWalkTimer = setInterval(() => {
    if (i >= path.length) {
      clearInterval(_exploreWalkTimer);
      _exploreWalkTimer = null;
      if (onComplete) onComplete();
      return;
    }
    const next = path[i];
    _exploreState.playerPos = next;
    const tilePctX = 100 / ROOM_W;
    const tilePctY = 100 / ROOM_H;
    const playerSize = 1.4;
    const pOffsetX = (playerSize - 1) / 2;
    playerEl.style.left = `${(next.x - pOffsetX) * tilePctX}%`;
    playerEl.style.top = `${(next.y - (playerSize - 1)) * tilePctY}%`;
    i++;
  }, stepDur);
}

function triggerInteraction(entity) {
  // Save player position, then route to the entity's dialogue scene
  saveExploreState(_exploreState.roomId, _exploreState.playerPos);
  _exploreState = null;
  if (_exploreWalkTimer) { clearInterval(_exploreWalkTimer); _exploreWalkTimer = null; }
  render(entity.def.scene);
}

function exitRoom() {
  const exitTo = _exploreState.room.exit_to;
  // Clear saved position so next entry starts at spawn
  if (state._explore_pos) delete state._explore_pos[_exploreState.roomId];
  _exploreState = null;
  if (_exploreWalkTimer) { clearInterval(_exploreWalkTimer); _exploreWalkTimer = null; }
  render(exitTo);
}

function bgForScene(sceneId) {
  // Map scene IDs to background sprites. Returns sprite key or null.
  if (!sceneId) return null;
  // Trader (outside the exit - basement-ish stone for now)
  if (sceneId === "scene_trader" || sceneId.startsWith("scene_trader_") || sceneId === "ending_trader_crushed" || sceneId === "ending_tripmine") return "bg_basement";
  if (sceneId === "scene_driveway" || sceneId.startsWith("scene_drive_") || sceneId.startsWith("scene_kitty_") || sceneId === "ending_kitty_store_closed") return "bg_basement";
  // Reagan trapped — pit/void
  if (sceneId === "scene_john_furious" || sceneId === "ending_reagan_trapped") return "bg_pit_lava";
  // Rasputin (warm, eerie)
  if (sceneId === "scene_rasputin" || sceneId === "scene_rasputin_doom" || sceneId === "scene_rasputin_darkness" || sceneId === "scene_rasputin_fortune") return "bg_warm";
  // EPA gauntlet → office tile
  if (sceneId.startsWith("scene_epa_") || sceneId === "ending_epa_truth" || sceneId === "ending_epa_bribe" || sceneId === "ending_epa_compliment" || sceneId === "ending_epa_win") return "bg_epa";
  // Pit gauntlet fights / Spirit / Doom endings → lava
  if (sceneId.startsWith("scene_pit_demon") || sceneId === "scene_pit_descent" || sceneId === "scene_pit_freshy" || sceneId.startsWith("scene_pit_heal") || sceneId === "scene_pit_spirit" || sceneId === "scene_pit_norbit_fakeout" || sceneId === "ending_pit_doom_death") return "bg_pit_lava";
  // Pit gauntlet wins → warm glow (Reagan freed)
  if (sceneId === "ending_pit_win_sowell" || sceneId === "ending_pit_win_election" || sceneId === "ending_pit_win_norbit") return "bg_warm";
  // Pit supervisor cycles 1-10 + scroll reveal at 45 + promoted + fired
  if (sceneId.startsWith("scene_pit_cycle_") ) {
    const n = parseInt(sceneId.replace("scene_pit_cycle_", ""));
    if (n >= 11 && n <= 44) return null;  // void
    return "bg_pit_stone";
  }
  if (sceneId === "scene_pit_promoted" || sceneId === "scene_pit_promotion_10" || sceneId === "ending_pit_fired") return "bg_pit_stone";
  if (sceneId === "scene_loadout_backup" || sceneId === "scene_loadout_support" || sceneId === "scene_loadout_special" || sceneId === "scene_loadout_wildcard" || sceneId === "scene_john_recognize" || sceneId === "ending_pit_refusal") return "bg_basement";
  // Plumpy room and related
  if (sceneId.startsWith("scene_plumpy") || sceneId.startsWith("scene_frack") || sceneId === "scene_fuel_reactor" || sceneId === "scene_reactor_powered" || sceneId === "ending_uranium" || sceneId === "ending_funko" || sceneId === "ending_plumpy_attack" || sceneId === "ending_frack_fail" || sceneId === "ending_true_win" || sceneId === "ending_no_pit") return "bg_plumpy";
  // Back room (cat lever)
  if (sceneId.startsWith("scene_cat") || sceneId === "scene_backroom_router" || sceneId.startsWith("ending_ww3_cat") || sceneId === "scene_lever_warning" || sceneId === "scene_lever_close" || sceneId === "scene_lever_open" || sceneId === "scene_john_truth_close" || sceneId === "ending_close_strait") return "bg_backroom";
  // Storage piles
  if (sceneId.startsWith("scene_pile") || sceneId.startsWith("scene_storage") || sceneId === "scene_tiki_lamp" || sceneId === "scene_gold_lamp" || sceneId.startsWith("scene_genie") || sceneId === "scene_tiki_used" || sceneId.startsWith("ending_genie")) return "bg_storage";
  // Samara (dark)
  if (sceneId.startsWith("scene_samara") || sceneId.startsWith("ending_samara") || sceneId.startsWith("ending_attack_samara")) return "bg_pit_stone";
  // John Prime confrontation (basement)
  if (sceneId.startsWith("scene_john") || sceneId.startsWith("scene_mtg") || sceneId.startsWith("ending_john") || sceneId === "scene_donotenter_router") return "bg_basement";
  // Default: basement for scene_test and other basement scenes
  if (sceneId === "scene_test" || sceneId === "scene_regret") return "bg_basement";
  return null;
}

function applyBackground(sceneId) {
  const bgKey = bgForScene(sceneId);
  if (bgKey && SPRITES[bgKey]) {
    document.documentElement.style.setProperty("--bg-image", `url("${SPRITES[bgKey]}")`);
    document.documentElement.style.setProperty("--bg-opacity", "1");
  } else {
    document.documentElement.style.setProperty("--bg-opacity", "0");
  }
}

function render(sceneId) {
  let scene = SCENES[sceneId];

  while (scene && scene.route) {
    const next = scene.route(state);
    scene = SCENES[next];
    sceneId = next;
  }

  if (!scene) {
    app.innerHTML = `<div class="scene-text">Error: scene "${sceneId}" not found.</div>`;
    return;
  }

  if (scene.set) Object.assign(state, scene.set);

  // Derived flag: Phase 2 with John Prime unlocks after either MtG 13-loop OR speaker save
  state._john_phase2_unlocked = !!(state.mtg_thirteen_done || state.speaker_path_used);

  // EXPLORE MODE: if scene has an explore_room, hand off to the explore renderer.
  if (scene.explore_room) {
    applyBackground(sceneId);
    renderExplore(sceneId);
    return;
  }

  applyBackground(sceneId);

  // Track deaths for the Rasputin hint character
  if (scene.ending && scene.ending_class === "bad" && !state._death_logged) {
    incrementDeaths();
    state._death_logged = true;
  }

  // ---- Music control: scene-aware track selection ----
  let trackForScene = "oogie.mp3";  // default ambient
  // Rasputin scenes (hint character)
  if (sceneId === "scene_rasputin" || sceneId === "scene_rasputin_doom" || sceneId === "scene_rasputin_darkness" || sceneId === "scene_rasputin_fortune") {
    trackForScene = "rasputin.mp3";
  }
  // Driving sequence + kitty food store
  else if (sceneId === "scene_drive_route_select" || sceneId === "scene_drive_hellscape" || sceneId.startsWith("scene_drive_scenic") || sceneId === "scene_drive_back" || sceneId.startsWith("scene_kitty_") || sceneId === "ending_kitty_store_closed") {
    trackForScene = "rocklobster.mp3";
  }
  // First MTG loop with John (Jungle Book)
  else if (sceneId === "scene_mtg_loop" || sceneId === "scene_mtg_check") {
    trackForScene = "jungle.mp3";
  }
  // Second MTG loop (Alan Wake 2)
  else if (sceneId === "scene_mtg_round2_loop" || sceneId === "scene_mtg_round2_check" || sceneId === "scene_mtg_round2_burnout") {
    trackForScene = "alanwake.mp3";
  }
  // EPA gauntlet (Killing in the Name)
  else if (sceneId === "scene_epa_arrives" || sceneId === "scene_epa_1" || sceneId === "scene_epa_2" || sceneId === "scene_epa_3" || sceneId === "ending_epa_bribe" || sceneId === "ending_epa_compliment") {
    trackForScene = "epa.mp3";
  } else if (sceneId === "ending_epa_truth") {
    trackForScene = "gameover.mp3";
  } else if (sceneId === "ending_epa_win") {
    trackForScene = "victory.mp3";
  }
  // Pit gauntlet (Doom Slayer branch)
  else if (sceneId.startsWith("scene_pit_") && !sceneId.startsWith("scene_pit_cycle") && sceneId !== "scene_pit_promoted" && sceneId !== "scene_pit_promotion_10") {
    trackForScene = "doom.mp3";
  } else if (sceneId === "ending_pit_doom_death") {
    trackForScene = "gameover.mp3";
  } else if (sceneId === "ending_pit_win_sowell" || sceneId === "ending_pit_win_election" || sceneId === "ending_pit_win_norbit" || sceneId === "scene_pit_norbit_fakeout") {
    trackForScene = "victory.mp3";
  }
  // Pit supervisor (cycles + final reward + senior promotion)
  else if (sceneId.startsWith("scene_pit_cycle") || sceneId === "scene_pit_promoted" || sceneId === "scene_pit_promotion_10") {
    trackForScene = "hero.mp3";
  } else if (sceneId === "ending_pit_fired") {
    trackForScene = "gameover.mp3";
  }
  // Win endings (true_win for fracking, etc.) — victory music
  else if (scene.ending && scene.ending_class === "win") {
    trackForScene = "victory.mp3";
  }
  // Bad endings outside the pit — game over
  else if (scene.ending && scene.ending_class === "bad") {
    trackForScene = "gameover.mp3";
  }
  // Neutral / regret endings — silence
  else if (scene.ending) {
    trackForScene = null;
  }

  if (trackForScene === null) {
    stopMusic();
  } else {
    playMusic(trackForScene, 0.35);
  }

  // Initialize demon HP when entering a fight scene for the first time
  if (scene.fight && state._currentFightScene !== sceneId) {
    state._currentFightScene = sceneId;
    state.pit_demon_hp = scene.demon_hp != null ? scene.demon_hp : 2;
    state.pit_demon_hp_max = state.pit_demon_hp;
    state.pit_fight_wrong = [];
  }

  let html = "";
  html += buildPitStatus();
  html += buildInventory();

  if (scene.sprite) {
    const spriteName = typeof scene.sprite === "function" ? scene.sprite(state) : scene.sprite;
    if (spriteName && SPRITES[spriteName]) {
      const flashClass = state._demonHitPending ? "demon-hit" : "";
      const extraClass = (spriteName === "samara") ? "samara-anim" : "";
      html += `<img id="demonSprite" class="pixel-art ${flashClass} ${extraClass}" src="${SPRITES[spriteName]}" alt="">`;
      if (state._demonHitPending) state._demonHitPending = false;
    }
  } else if (scene.art) {
    const url = artToDataUrl(scene.art);
    if (url) html += `<img class="pixel-art" src="${url}" alt="">`;
  }

  // Demon HP bar below the sprite (fight scenes only)
  if (scene.fight) {
    let cells = "";
    for (let i = 0; i < state.pit_demon_hp_max; i++) {
      cells += `<div class="demon-hp-cell ${i < state.pit_demon_hp ? 'filled' : ''}"></div>`;
    }
    html += `<div class="demon-hp">${cells}</div>`;
  }

  // Gun overlay removed — it blocked the choice buttons


  if (scene.ending) {
    const cls = scene.ending_class ? ` ${scene.ending_class}` : "";
    html += `<div class="ending-label${cls}">— ${scene.ending_label || "The End"} —</div>`;
  }

  html += `<div class="scene-text">${escapeHtml(resolveText(scene.text))}</div>`;

  if (scene.input) {
    html += `
      <input type="text" class="text-input" id="textInput" placeholder="${escapeHtml(scene.input.placeholder || "")}" autocomplete="off" />
      <button class="submit-button" id="submitInput">Submit</button>
      <div class="input-error" id="inputError"></div>
    `;
    // Render choices alongside input (e.g., a "let me get back to you" escape option)
    if (scene.choices) {
      const visible = scene.choices.filter(isChoiceVisible);
      html += `<div class="choices">`;
      visible.forEach((c, i) => {
        const label = typeof c.text === "function" ? c.text(state) : c.text;
        html += `<button class="choice" data-idx="${i}">${escapeHtml(label)}</button>`;
      });
      html += `</div>`;
      scene._visibleCache = visible;
    }
  } else if (scene.ending) {
    const turns = state._turns || 0;
    const nearMisses = state._near_misses || 0;
    const turnsLabel = turns === 1 ? "1 turn" : `${turns} turns`;
    const missLabel = nearMisses === 1 ? "1 near-death experience" : `${nearMisses} near-death experiences`;
    html += `<div class="stats-block">
      <div class="stats-title">Final Report</div>
      <div class="stats-row"><span>Turns survived:</span><span>${turnsLabel}</span></div>
      <div class="stats-row"><span>Bullets dodged:</span><span>${missLabel}</span></div>
    </div>`;
    html += `<button class="restart" id="restartBtn">Play again</button>`;
  } else if (scene.choices) {
    let displayChoices;
    if (scene.fight) {
      // For fight scenes: show ALL choices (except those skipped by requires/unless/wrong-list),
      // but mark resource-zero ones as "spent" — clicking them damages the player
      displayChoices = scene.choices.filter(c => {
        if (c.requires) for (const k of c.requires) if (!state[k]) return false;
        if (c.unless) for (const k of c.unless) if (state[k]) return false;
        if (c.id && state.pit_fight_wrong && state.pit_fight_wrong.includes(c.id)) return false;
        return true;
      }).map(c => {
        // Determine if resource is depleted
        let isSpent = false;
        if (c.requires_count) {
          for (const k of c.requires_count) {
            if (!(state[k] > 0)) { isSpent = true; break; }
          }
        }
        return Object.assign({}, c, { spent: isSpent });
      });
    } else {
      displayChoices = scene.choices.filter(isChoiceVisible);
    }
    const visibleFinal = displayChoices;
    html += `<div class="choices">`;
    visibleFinal.forEach((c, i) => {
      const label = typeof c.text === "function" ? c.text(state) : c.text;
      const cls = c.spent ? "choice spent" : "choice";
      html += `<button class="${cls}" data-idx="${i}">${escapeHtml(label)}</button>`;
    });
    html += `</div>`;
    // Replace `visible` with the displayed set for later click-handler reference
    scene._visibleCache = visibleFinal;
  }

  if (!scene.ending) {
    html += `<a class="restart-link" id="restartLink">Restart story</a>`;
  }

  app.innerHTML = html;

  // Resolve a scene ID through any routing chain to its terminal scene
  function resolveTerminal(sceneId, depth) {
    depth = depth || 0;
    if (depth > 10) return null;
    const s = SCENES[sceneId];
    if (!s) return null;
    if (s.route) return resolveTerminal(s.route(state), depth + 1);
    return s;
  }

  if (scene.choices) {
    const visible = scene._visibleCache || scene.choices.filter(isChoiceVisible);
    // Check if any visible choice leads to a terminal ending
    const anyDeadly = visible.some(c => {
      if (!c.next || c.next === "self") return false;
      const t = resolveTerminal(c.next);
      return t && t.ending;
    });

    // Fight scenes: render timer bar at top of screen and start countdown
    let timerId = null;
    let timeoutId = null;
    // Always remove any leftover timer from previous scene
    const oldTimer = document.querySelector(".pit-timer");
    if (oldTimer) oldTimer.remove();
    if (scene.fight) {
      const timerEl = document.createElement("div");
      timerEl.className = "pit-timer";
      timerEl.innerHTML = `<div class="pit-timer-fill" id="timerFill" style="width:100%; transition: width ${scene.fight_seconds || 8}s linear;"></div>`;
      document.body.appendChild(timerEl);
      // Kick off animation on next frame
      requestAnimationFrame(() => {
        const fill = document.getElementById("timerFill");
        if (fill) fill.style.width = "0%";
      });
      // On timeout, treat as a wrong choice (wound)
      timeoutId = setTimeout(() => {
        applyFightWound(sceneId, null);
      }, (scene.fight_seconds || 8) * 1000);
    }

    function clearTimers() {
      if (timeoutId) clearTimeout(timeoutId);
      if (timerId) clearInterval(timerId);
    }

    function applyFightWound(currentSceneId, choiceData) {
      clearTimers();
      // Play hit sound
      playSfx("ow");
      flashDamage();
      state.pit_hp = Math.max(0, (state.pit_hp || 0) - 1);
      state._near_misses = (state._near_misses || 0) + 1;
      // Track this choice as already-wrong so we don't show it on retry
      if (choiceData && choiceData.id) {
        state.pit_fight_wrong = state.pit_fight_wrong || [];
        state.pit_fight_wrong.push(choiceData.id);
      }
      if (state.pit_hp <= 0) {
        render("ending_pit_doom_death");
        return;
      }
      // Re-render same scene (with wound state applied; wrong option filtered by isChoiceVisible)
      render(currentSceneId);
    }

    document.querySelectorAll(".choice").forEach((btn) => {
      btn.addEventListener("click", () => {
        const c = visible[parseInt(btn.dataset.idx)];
        clearTimers();
        // Play sound effect if specified
        if (c.sfx) playSfx(c.sfx);
        if (c.set) Object.assign(state, c.set);
        // Handle named actions
        if (c.action === "increment_mtg") {
          state.mtg_games_played = (state.mtg_games_played || 0) + 1;
        }
        if (c.action === "increment_mtg_round2") {
          state._mtg_round2_games = (state._mtg_round2_games || 0) + 1;
        }
        if (c.action === "increment_drinks") {
          state._drinks_with_john = (state._drinks_with_john || 0) + 1;
        }
        if (c.action === "soft_reset") {
          // Reset all state to fresh (do NOT count as a death)
          resetState();
        }
        // Pit fight resolution
        if (scene.fight) {
          // Check if user clicked a SPENT option (special case: still visible but at 0 uses)
          if (c.spent) {
            // Show "out of ammo" toast AND damage the player
            showAmmoToast(c);
            applyFightWound(sceneId, null);
            return;
          }
          if (c.correct) {
            // Determine damage to demon
            let dmg = c.instant_kill ? state.pit_demon_hp : 1;
            if (c.consumes) state[c.consumes] = Math.max(0, (state[c.consumes] || 0) - 1);
            state.pit_demon_hp = Math.max(0, state.pit_demon_hp - dmg);
            state._demonHitPending = true;
            if (state.pit_demon_hp > 0) {
              // Demon still alive — re-render same fight scene with reduced HP
              clearTimers();
              render(sceneId);
              return;
            } else {
              // Demon killed — clear fight state and advance
              state._currentFightScene = null;
              state.pit_fight_wrong = [];
            }
          } else {
            // Wrong choice — wound and consume the item
            if (c.consumes) state[c.consumes] = Math.max(0, (state[c.consumes] || 0) - 1);
            applyFightWound(sceneId, c);
            return;
          }
        }
        // Plumpy panic button — auto-kill the demon + grant one extra life (+1 max HP, +1 current HP)
        if (c.action === "plumpy_panic") {
          state.pit_plumpy_available = false;
          state.pit_demon_hp = 0;
          state.pit_hp_max = (state.pit_hp_max || 0) + 1;
          state.pit_hp = (state.pit_hp || 0) + 1;
          state._plumpy_just_saved = true;
          state._currentFightScene = null;
          state.pit_fight_wrong = [];
        }
        // Heal action
        if (c.action === "heal_one") {
          state.pit_hp = Math.min(state.pit_hp_max, (state.pit_hp || 0) + 1);
          if (c.consumes) state[c.consumes] = Math.max(0, (state[c.consumes] || 0) - 1);
          playSfx("drink");
        }
        // Count turns
        state._turns = (state._turns || 0) + 1;
        const target = (c.next === "self" || c.next == null) ? sceneId : c.next;
        const targetScene = resolveTerminal(target);
        if (anyDeadly && targetScene && !targetScene.ending) {
          state._near_misses = (state._near_misses || 0) + 1;
        }
        // Door open animation: brief delay before transition for visual feedback
        if (c.door_anim) {
          const doorImg = document.querySelector(".pixel-art");
          if (doorImg) {
            doorImg.style.transition = "transform 0.3s ease, opacity 0.3s ease";
            doorImg.style.transform = "scale(1.08)";
            doorImg.style.opacity = "0.5";
          }
          playSfx("hit");
          setTimeout(() => render(target), 500);
        } else {
          render(target);
        }
      });
    });
  }

  if (scene.ending) {
    document.getElementById("restartBtn").addEventListener("click", start);
  }

  if (scene.input) {
    const inputEl = document.getElementById("textInput");
    const submitEl = document.getElementById("submitInput");
    const errorEl = document.getElementById("inputError");

    const submit = () => {
      const raw = inputEl.value.trim().toLowerCase().replace(/[\s,]+/g, "");
      const accepted = (scene.input.accept || []).map(s => s.toLowerCase().replace(/[\s,]+/g, ""));
      if (accepted.includes(raw)) {
        if (scene.input.set) Object.assign(state, scene.input.set);
        render(scene.input.success_next);
      } else if (scene.input.error_next) {
        // Route to a specific scene on wrong answer (no retry)
        render(scene.input.error_next);
      } else {
        const errMsg = typeof scene.input.error === "function" ? scene.input.error(state) : (scene.input.error || "That's not it. Try again.");
        errorEl.textContent = errMsg;
      }
    };

    submitEl.addEventListener("click", submit);
    inputEl.addEventListener("keypress", (e) => { if (e.key === "Enter") submit(); });
    setTimeout(() => inputEl.focus(), 100);
  }

  const restartLink = document.getElementById("restartLink");
  if (restartLink) restartLink.addEventListener("click", start);

  window.scrollTo(0, 0);
}

function start() {
  stopMusic();
  resetState();
  render(START_SCENE);
}

start();
</script>
</body>
</html>
