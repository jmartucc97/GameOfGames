<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Story</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f0f12;
    color: #e8e8ea;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 20px 40px;
    line-height: 1.6;
    position: relative;
  }
  /* Background image layer - tiled texture per scene */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: var(--bg-image, none);
    background-repeat: repeat;
    background-size: 48px 48px;  /* smaller tile = more ambient, less visually competing */
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    opacity: var(--bg-opacity, 0);
    z-index: -2;
    transition: opacity 0.5s ease;
  }
  /* Dark vignette/overlay for readability */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, rgba(15,15,18,0.65) 0%, rgba(15,15,18,0.80) 100%);
    pointer-events: none;
    z-index: -1;
    opacity: var(--bg-opacity, 0);
    transition: opacity 0.5s ease;
  }
  /* Scene text gets a slight backing so it stays readable on textured bg */
  .scene-text {
    background: rgba(15, 15, 18, 0.55);
    backdrop-filter: blur(2px);
    padding: 12px 16px;
    border-radius: 8px;
  }
  .container { width: 100%; max-width: 600px; flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .inventory {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-bottom: 16px;
    animation: fadeIn 0.4s ease;
  }
  .inventory-label {
    font-size: 0.7rem;
    color: #5a5a62;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-right: 4px;
  }
  .inv-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 999px;
    background: #1e1e26;
    border: 1px solid #2e2e38;
    font-size: 0.78rem;
    color: #c8c8d0;
    line-height: 1.2;
    white-space: nowrap;
  }
  .inv-chip .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #888;
  }
  .inv-chip.tool   { border-color: #4a6a8a; }   .inv-chip.tool .dot   { background: #6a9adb; }
  .inv-chip.doc    { border-color: #8a7a3a; }   .inv-chip.doc .dot    { background: #e0c870; }
  .inv-chip.food   { border-color: #6a8a3a; }   .inv-chip.food .dot   { background: #a8d870; }
  .inv-chip.gift   { border-color: #8a3a6a; }   .inv-chip.gift .dot   { background: #d870aa; }
  .inv-chip.weapon { border-color: #8a4a3a; }   .inv-chip.weapon .dot { background: #d8704a; }
  .inv-chip.misc   { border-color: #555;    }   .inv-chip.misc .dot   { background: #aaa; }

  /* ============= PIT GAUNTLET UI ============= */
  .pit-status {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
    padding: 10px 14px;
    background: #14141a;
    border: 1px solid #2a2a32;
    border-radius: 8px;
    animation: fadeIn 0.4s ease;
  }
  .pit-hp-block { flex: 1; }
  .pit-hp-label {
    font-size: 0.62rem;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-bottom: 4px;
  }
  .pit-hp-bar {
    display: flex;
    gap: 4px;
    height: 18px;
  }
  .pit-hp-cell {
    flex: 1;
    background: #2a2a32;
    border-radius: 2px;
    transition: background 0.3s ease, transform 0.2s ease;
  }
  .pit-hp-cell.filled { background: linear-gradient(180deg, #d83a3a, #8a2222); box-shadow: 0 0 4px rgba(216,58,58,0.5); }
  .pit-hp-cell.draining {
    animation: hpDrain 0.6s ease;
  }
  @keyframes hpDrain {
    0%   { background: #ff8a3a; transform: scaleY(1.4); }
    50%  { background: #d83a3a; }
    100% { background: #2a2a32; transform: scaleY(1); }
  }

  .pit-ammo {
    display: flex;
    gap: 4px;
    flex-direction: column;
    align-items: flex-end;
    font-size: 0.7rem;
  }
  .pit-ammo-row { display: flex; align-items: center; gap: 6px; color: #aaa; }
  .pit-ammo-dots { display: flex; gap: 2px; }
  .pit-ammo-dot {
    width: 8px; height: 8px;
    background: #d8a050;
    border-radius: 50%;
    transition: opacity 0.4s ease, transform 0.3s ease;
  }
  .pit-ammo-dot.spent { opacity: 0.15; background: #555; }
  .pit-ammo-dot.firing { animation: dotFire 0.5s ease; }
  @keyframes dotFire {
    0%   { transform: scale(1.8); background: #fff; box-shadow: 0 0 12px #ffd070; }
    100% { transform: scale(1); background: #555; opacity: 0.15; }
  }

  .pit-timer {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 8px;
    background: #1a1a22;
    z-index: 100;
    overflow: hidden;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }
  .pit-timer-fill {
    height: 100%;
    background: linear-gradient(90deg, #6acc6a, #d8a050, #d83a3a);
    transition: width linear;
  }

  .screen-shake { animation: shake 0.45s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    15% { transform: translateX(-6px); }
    30% { transform: translateX(6px); }
    45% { transform: translateX(-4px); }
    60% { transform: translateX(4px); }
    75% { transform: translateX(-2px); }
  }
  .damage-flash {
    position: fixed; inset: 0;
    background: rgba(216, 58, 58, 0.35);
    pointer-events: none;
    z-index: 1000;
    animation: damageFlash 0.5s ease;
  }
  @keyframes damageFlash {
    0%   { opacity: 1; }
    100% { opacity: 0; }
  }

  /* Demon HP bar overlay on sprite */
  .demon-wrap {
    position: relative;
    display: block;
    margin: 0 auto;
    width: 100%;
  }
  .demon-hp {
    display: flex;
    gap: 4px;
    justify-content: center;
    margin-top: -6px;
    margin-bottom: 8px;
  }
  .demon-hp-cell {
    width: 40px;
    height: 12px;
    background: #2a2a32;
    border: 1px solid #444;
    border-radius: 2px;
    transition: background 0.3s ease;
  }
  .demon-hp-cell.filled {
    background: linear-gradient(180deg, #b03050, #6a1820);
    box-shadow: 0 0 4px rgba(176, 48, 80, 0.6);
  }
  .demon-hp-cell.draining { animation: demonHpDrain 0.6s ease; }
  @keyframes demonHpDrain {
    0%   { background: #ffeb70; transform: scaleY(1.4); }
    50%  { background: #d8a050; }
    100% { background: #2a2a32; transform: scaleY(1); }
  }

  .demon-hit { animation: demonHitFlash 0.4s ease; }
  @keyframes demonHitFlash {
    0%, 100% { filter: none; }
    20% { filter: brightness(3) saturate(0) drop-shadow(0 0 8px #fff); }
    50% { filter: brightness(2) saturate(2); }
  }

  /* Spent item button — grayed out, still clickable */
  .choice.spent {
    opacity: 0.4;
    border-color: #3a1818 !important;
    color: #884444 !important;
    text-decoration: line-through;
    background: #1a0e0e !important;
    cursor: not-allowed;
  }
  .choice.spent::after {
    content: " — empty";
    color: #884444;
    font-size: 0.75em;
    text-decoration: none;
    margin-left: 4px;
  }

  .ammo-toast {
    position: fixed;
    top: 30%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(40, 10, 10, 0.95);
    color: #ff9090;
    border: 1px solid #6a2020;
    padding: 10px 24px;
    border-radius: 6px;
    font-size: 1.1rem;
    font-weight: bold;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    z-index: 2000;
    pointer-events: none;
    animation: ammoToast 1.1s ease;
  }
  @keyframes ammoToast {
    0%   { opacity: 0; transform: translate(-50%, -40%); }
    15%  { opacity: 1; transform: translate(-50%, -50%); }
    85%  { opacity: 1; transform: translate(-50%, -50%); }
    100% { opacity: 0; transform: translate(-50%, -60%); }
  }

  .pixel-art {
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    width: 100%;
    max-width: 520px;
    height: auto;
    display: block;
    margin: 0 auto 24px;
    background: #16161c;
    border-radius: 8px;
    padding: 16px;
    object-fit: contain;
    animation: fadeIn 0.4s ease;
  }
  .scene-text {
    font-size: 1.1rem;
    margin-bottom: 28px;
    white-space: pre-wrap;
    animation: fadeIn 0.4s ease;
  }
  .choices { display: flex; flex-direction: column; gap: 12px; animation: fadeIn 0.4s ease 0.1s both; }
  .choice {
    background: #1c1c22;
    border: 1px solid #2a2a32;
    color: #e8e8ea;
    padding: 16px 18px;
    border-radius: 12px;
    font-size: 1rem;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    transition: background 0.15s, transform 0.05s;
    line-height: 1.4;
  }
  .choice:hover { background: #25252e; }
  .choice:active { transform: scale(0.98); background: #2e2e38; }
  .ending-label {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #888;
    margin-bottom: 16px;
    text-align: center;
  }
  .ending-label.win { color: #5aaa4a; }
  .ending-label.bad { color: #c03a3a; }
  .restart {
    background: #e8e8ea;
    color: #0f0f12;
    border: none;
    padding: 16px 24px;
    border-radius: 12px;
    font-size: 1rem;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    margin-top: 16px;
    width: 100%;
  }
  .restart:active { transform: scale(0.98); }
  .text-input {
    background: #1c1c22;
    border: 1px solid #2a2a32;
    color: #e8e8ea;
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 1rem;
    font-family: inherit;
    width: 100%;
    margin-bottom: 12px;
  }
  .text-input:focus { outline: none; border-color: #4a4a52; }
  .submit-button {
    background: #e8e8ea;
    color: #0f0f12;
    border: none;
    padding: 14px 20px;
    border-radius: 12px;
    font-size: 1rem;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
  }
  .submit-button:active { transform: scale(0.98); }
  .input-error {
    color: #c03a3a;
    font-size: 0.9rem;
    margin-top: 12px;
    text-align: center;
    min-height: 1.2em;
  }
  .restart-link {
    display: block;
    text-align: center;
    margin-top: 28px;
    font-size: 0.78rem;
    color: #444;
    text-decoration: underline;
    cursor: pointer;
  }
  .restart-link:hover { color: #777; }
  .stats-block {
    background: #16161c;
    border: 1px solid #2a2a32;
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 16px;
    animation: fadeIn 0.4s ease 0.2s both;
  }
  .stats-title {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #6a6a72;
    margin-bottom: 10px;
    text-align: center;
  }
  .stats-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.92rem;
    color: #c8c8ca;
    padding: 4px 0;
  }
  .stats-row span:first-child { color: #888; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>

<div class="container">
  <div id="app"></div>
</div>

function pileChoices(pileItems, returnScene) {
  const choices = [];
  // Take each item (auto-swaps - clears other items in pile, sets this one)
  pileItems.forEach(item => {
    const set = {};
    pileItems.forEach(other => { set[other.flag] = (other.id === item.id); });
    choices.push({
      text: `Take the ${item.label}`,
      next: returnScene === "self" ? null : returnScene,
      set: set,
      unless: [item.flag]
    });
  });
  // Put back current item
  pileItems.forEach(item => {
    const set = {};
    set[item.flag] = false;
    choices.push({
      text: `Put back the ${item.label}`,
      set: set,
      requires: [item.flag]
    });
  });
  return choices;
}

  ending_pit_win_sowell: {
    sprite: "john_friendly",
    text: "You open the book and start reading. Chapter 1. \"Scarcity is the basic condition of human existence.\"\n\nThe Spirit takes a step back. Its mouth keeps opening but no sound comes out anymore. You keep reading. Prices as information. Comparative advantage. Unintended consequences.\n\nBy the third chapter the Spirit is on its knees clutching its head. By the fifth it explodes into a cloud of low-density mist.\n\nThe air clears.\n\nFrom the empty space where the Spirit had been, a different figure emerges. Translucent. Smiling. Slightly tilted head.\n\n\"Saved,\" Ronald Reagan says, \"by Mr. Gorbachev's own hardware and three American patriots.\"\n\nHe winks. He fades upward.",

    text: "You unfold the printout. State by state. County by county. Margin of victory in seven swing states. The popular vote.\n\nThe Spirit stares.\n\nIt makes a small noise. A choked, low, rattling noise. It tries to speak. It can't.\n\nIt stares at the numbers for a long time. Then it screams once, a long thin scream, and dissolves into mist.\n\nThe air clears.\n\nFrom the empty space where the Spirit had been, a translucent figure emerges. Smiling. Slightly tilted head.\n\n\"Saved,\" Ronald Reagan says, \"by Mr. Gorbachev's own hardware and three American patriots.\"\n\nHe winks. He fades upward.",

  ending_pit_win_norbit: {
    sprite: "john_attack",
    text: "John Prime rappels down the pit on a rope that wasn't there a moment ago.\n\n\"That,\" he says, voice level, \"was a VINTAGE sealed copy of Norbit on Blu-Ray.\"\n\nHe turns to the Spirit.\n\nWhat follows is not a fight. It is a lecture. John begins by walking the Spirit through the Louisiana Purchase of 1803, the doubling of the United States' landmass under Jefferson, the Northwest Ordinance, and the patterns of westward settlement that defined a century of American history — explaining that nation-building requires deliberate territorial expansion, anchored by infrastructure and law, not vibes. He pivots to the Treaty of Westphalia, 1648, the founding of the modern nation-state system, and explains with rising intensity that a state without borders is not a state at all but a vague feeling about a region, and that the entire concept of citizenship — the rights AND the obligations — collapses without a defined territory in which legitimate authority is exercised. He finishes by tracing the lineage of Western legal tradition back to the Roman Twelve Tables of 450 BC, the praetor edicts, and Justinian's codification in the sixth century — explaining that everything the Spirit takes for granted, every right it claims to defend, every procedural protection, every concept of equal application of the law, descends in an unbroken line from Roman jurists who understood that without codified law there is only the will of the strong.\n\nThe Spirit slumps to the ground.\n\nIt raises its head one last time and screams: \"REEEEEEEEEE.\"\n\nIt explodes into mist.\n\nFrom the empty space where the Spirit had been, a translucent figure emerges. Smiling. Slightly tilted head.\n\n\"Saved,\" Ronald Reagan says, \"by Mr. Gorbachev's own hardware and three American patriots.\"\n\nHe winks. He fades upward.\n\nJohn Prime is still holding the broken Blu-Ray. He does not look up.",

function artToDataUrl(artLines) {
  if (!artLines || !artLines.length) return null;
  const width = Math.max(...artLines.map(l => l.length));
  const height = artLines.length;
  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext("2d");
  for (let y = 0; y < height; y++) {
    const line = artLines[y];
    for (let x = 0; x < line.length; x++) {
      const ch = line[x];
      const color = PALETTE[ch];
      if (color && color !== "transparent") {
        ctx.fillStyle = color;
        ctx.fillRect(x, y, 1, 1);
      }
    }
  }
  return canvas.toDataURL();
}

function buildPitStatus() {
  if (!state.pit_initiated) return "";
  const hp = state.pit_hp;
  const max = state.pit_hp_max;
  let cells = "";
  for (let i = 0; i < max; i++) {
    cells += `<div class="pit-hp-cell ${i < hp ? 'filled' : ''}"></div>`;
  }
  // Ammo summary chips (compact)
  const ammoRows = [];
  if (state.pit_kalash_uses > 0) ammoRows.push({ name: "Kalash", uses: state.pit_kalash_uses, max: 8 });
  if (state.pit_backup) ammoRows.push({ name: backupLabel(state.pit_backup), uses: state.pit_backup_uses, max: 6 });
  if (state.pit_support) ammoRows.push({ name: supportLabel(state.pit_support), uses: state.pit_support_uses, max: 2 });
  if (state.pit_special && state.pit_special_uses > 0) ammoRows.push({ name: specialLabel(state.pit_special), uses: state.pit_special_uses, max: 1 });
  if (state.pit_wildcard && state.pit_wildcard_uses > 0) ammoRows.push({ name: wildcardLabel(state.pit_wildcard), uses: state.pit_wildcard_uses, max: 1 });
  const ammoHtml = ammoRows.map(r => {
    let dots = "";
    for (let i = 0; i < r.max; i++) {
      dots += `<div class="pit-ammo-dot ${i >= r.uses ? 'spent' : ''}"></div>`;
    }
    return `<div class="pit-ammo-row"><span>${r.name}</span><span class="pit-ammo-dots">${dots}</span></div>`;
  }).join("");
  return `<div class="pit-status">
    <div class="pit-hp-block">
      <div class="pit-hp-label">Vitals — Hit Points</div>
      <div class="pit-hp-bar" id="pitHpBar">${cells}</div>
    </div>
    <div class="pit-ammo">${ammoHtml}</div>
  </div>`;
}

// ---- Background music control ----
let _bgmAudio = null;
let _bgmCurrentSrc = null;

function playMusic(src, volume) {
  if (volume == null) volume = 0.35;
  // If already playing this src, leave it alone
  if (_bgmAudio && _bgmCurrentSrc === src && !_bgmAudio.paused) return;
  stopMusic();
  _bgmAudio = new Audio(src);
  _bgmAudio.loop = true;
  _bgmAudio.volume = volume;
  _bgmCurrentSrc = src;
  // Browsers block autoplay until a user gesture; play() returns a Promise that may reject
  const p = _bgmAudio.play();
  if (p && typeof p.catch === "function") p.catch(() => { /* swallow autoplay errors */ });
}

function stopMusic() {
  if (_bgmAudio) {
    try { _bgmAudio.pause(); } catch {}
    _bgmAudio = null;
    _bgmCurrentSrc = null;
  }
}

function playSfx(name) {
  // Plays a short sound effect. Uses tiny WebAudio synth tones for now (no asset files).
  try {
    const ctx = window._audioCtx || (window._audioCtx = new (window.AudioContext || window.webkitAudioContext)());
    if (ctx.state === "suspended") ctx.resume();
    const presets = {
      gunshot: { freq: 80,  type: "square",   dur: 0.12, decay: 0.18 },
      chainsaw:{ freq: 140, type: "sawtooth", dur: 0.5,  decay: 0.6  },
      shot:    { freq: 200, type: "square",   dur: 0.10, decay: 0.15 },
      hit:     { freq: 60,  type: "sine",     dur: 0.15, decay: 0.25 },
      ow:      { freq: 320, type: "sawtooth", dur: 0.18, decay: 0.3  },
      drink:   { freq: 540, type: "sine",     dur: 0.25, decay: 0.35 },
      magic:   { freq: 880, type: "triangle", dur: 0.3,  decay: 0.5  },
      explode: { freq: 50,  type: "square",   dur: 0.4,  decay: 0.6  },
    };
    const p = presets[name] || presets.shot;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = p.type;
    osc.frequency.setValueAtTime(p.freq, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(p.freq * 0.4, ctx.currentTime + p.dur);
    gain.gain.setValueAtTime(0.35, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + p.decay);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + p.decay);
  } catch (e) {
    // sound failures are non-fatal
  }
}

function isChoiceVisible(c) {
  if (c.requires) for (const k of c.requires) if (!state[k]) return false;
  if (c.unless) for (const k of c.unless) if (state[k]) return false;
  if (c.requires_count) {
    for (const k of c.requires_count) if (!(state[k] > 0)) return false;
  }
  // For fight scenes: skip choices already tried in current fight
  if (c.id && state.pit_fight_wrong && state.pit_fight_wrong.includes(c.id)) return false;
  return true;
}

function resolveText(t) {
  return typeof t === "function" ? t(state) : t;
}

function escapeHtml(str) {
  const div = document.createElement("div");

  return div.innerHTML;
}

function bgForScene(sceneId) {
  // Map scene IDs to background sprites. Returns sprite key or null.
  if (!sceneId) return null;
  // Rasputin (warm, eerie)
  if (sceneId === "scene_rasputin" || sceneId === "scene_rasputin_doom" || sceneId === "scene_rasputin_darkness" || sceneId === "scene_rasputin_fortune") return "bg_warm";
  // EPA gauntlet → office tile
  if (sceneId.startsWith("scene_epa_") || sceneId === "ending_epa_truth" || sceneId === "ending_epa_bribe" || sceneId === "ending_epa_compliment" || sceneId === "ending_epa_win") return "bg_epa";
  // Pit gauntlet fights / Spirit / Doom endings → lava
  if (sceneId.startsWith("scene_pit_demon") || sceneId === "scene_pit_descent" || sceneId === "scene_pit_freshy" || sceneId.startsWith("scene_pit_heal") || sceneId === "scene_pit_spirit" || sceneId === "scene_pit_norbit_fakeout" || sceneId === "ending_pit_doom_death") return "bg_pit_lava";
  // Pit gauntlet wins → warm glow (Reagan freed)
  if (sceneId === "ending_pit_win_sowell" || sceneId === "ending_pit_win_election" || sceneId === "ending_pit_win_norbit") return "bg_warm";
  // Pit supervisor cycles 1-10 + scroll reveal at 45 + promoted + fired
  if (sceneId.startsWith("scene_pit_cycle_") ) {
    const n = parseInt(sceneId.replace("scene_pit_cycle_", ""));
    if (n >= 11 && n <= 44) return null;  // void
    return "bg_pit_stone";
  }
  if (sceneId === "scene_pit_promoted" || sceneId === "scene_pit_promotion_10" || sceneId === "ending_pit_fired") return "bg_pit_stone";
  if (sceneId === "scene_loadout_backup" || sceneId === "scene_loadout_support" || sceneId === "scene_loadout_special" || sceneId === "scene_loadout_wildcard" || sceneId === "scene_john_recognize" || sceneId === "ending_pit_refusal") return "bg_basement";
  // Plumpy room and related
  if (sceneId.startsWith("scene_plumpy") || sceneId.startsWith("scene_frack") || sceneId === "scene_fuel_reactor" || sceneId === "scene_reactor_powered" || sceneId === "ending_uranium" || sceneId === "ending_funko" || sceneId === "ending_plumpy_attack" || sceneId === "ending_frack_fail" || sceneId === "ending_true_win" || sceneId === "ending_no_pit") return "bg_plumpy";
  // Back room (cat lever)
  if (sceneId.startsWith("scene_cat") || sceneId === "scene_backroom_router" || sceneId.startsWith("ending_ww3_cat") || sceneId === "scene_lever_warning" || sceneId === "scene_lever_close" || sceneId === "scene_lever_open" || sceneId === "scene_john_truth_close" || sceneId === "ending_close_strait") return "bg_backroom";
  // Storage piles
  if (sceneId.startsWith("scene_pile") || sceneId.startsWith("scene_storage") || sceneId === "scene_tiki_lamp" || sceneId === "scene_gold_lamp" || sceneId.startsWith("scene_genie") || sceneId === "scene_tiki_used" || sceneId.startsWith("ending_genie")) return "bg_storage";
  // Samara (dark)
  if (sceneId.startsWith("scene_samara") || sceneId.startsWith("ending_samara") || sceneId.startsWith("ending_attack_samara")) return "bg_pit_stone";
  // John Prime confrontation (basement)
  if (sceneId.startsWith("scene_john") || sceneId.startsWith("scene_mtg") || sceneId.startsWith("ending_john") || sceneId === "scene_donotenter_router") return "bg_basement";
  // Default: basement for scene_test and other basement scenes
  if (sceneId === "scene_test" || sceneId === "scene_regret") return "bg_basement";
  return null;
}

function applyBackground(sceneId) {
  const bgKey = bgForScene(sceneId);
  if (bgKey && SPRITES[bgKey]) {
    document.documentElement.style.setProperty("--bg-image", `url("${SPRITES[bgKey]}")`);
    document.documentElement.style.setProperty("--bg-opacity", "1");
  } else {
    document.documentElement.style.setProperty("--bg-opacity", "0");
  }
}

function render(sceneId) {
  let scene = SCENES[sceneId];

  while (scene && scene.route) {
    const next = scene.route(state);
    scene = SCENES[next];
    sceneId = next;
  }

  if (!scene) {
    app.innerHTML = `<div class="scene-text">Error: scene "${sceneId}" not found.</div>`;
    return;
  }

  if (scene.set) Object.assign(state, scene.set);

  applyBackground(sceneId);

  // Track deaths for the Rasputin hint character
  if (scene.ending && scene.ending_class === "bad" && !state._death_logged) {
    incrementDeaths();
    state._death_logged = true;
  }

  // ---- Music control: scene-aware track selection ----
  let trackForScene = "oogie.mp3";  // default ambient
  // Rasputin scenes (hint character)
  if (sceneId === "scene_rasputin" || sceneId === "scene_rasputin_doom" || sceneId === "scene_rasputin_darkness" || sceneId === "scene_rasputin_fortune") {
    trackForScene = "soviet.mp3";
  }
  // EPA gauntlet (Killing in the Name)
  else if (sceneId === "scene_epa_arrives" || sceneId === "scene_epa_1" || sceneId === "scene_epa_2" || sceneId === "scene_epa_3" || sceneId === "ending_epa_bribe" || sceneId === "ending_epa_compliment") {
    trackForScene = "epa.mp3";
  } else if (sceneId === "ending_epa_truth") {
    trackForScene = "gameover.mp3";
  } else if (sceneId === "ending_epa_win") {
    trackForScene = "victory.mp3";
  }
  // Pit gauntlet (Doom Slayer branch)
  else if (sceneId.startsWith("scene_pit_") && !sceneId.startsWith("scene_pit_cycle") && sceneId !== "scene_pit_promoted" && sceneId !== "scene_pit_promotion_10") {
    trackForScene = "doom.mp3";
  } else if (sceneId === "ending_pit_doom_death") {
    trackForScene = "gameover.mp3";
  } else if (sceneId === "ending_pit_win_sowell" || sceneId === "ending_pit_win_election" || sceneId === "ending_pit_win_norbit" || sceneId === "scene_pit_norbit_fakeout") {
    trackForScene = "victory.mp3";
  }
  // Pit supervisor (cycles + final reward + senior promotion)
  else if (sceneId.startsWith("scene_pit_cycle") || sceneId === "scene_pit_promoted" || sceneId === "scene_pit_promotion_10") {
    trackForScene = "hero.mp3";
  } else if (sceneId === "ending_pit_fired") {
    trackForScene = "gameover.mp3";
  }
  // Win endings (true_win for fracking, etc.) — victory music
  else if (scene.ending && scene.ending_class === "win") {
    trackForScene = "victory.mp3";
  }
  // Bad endings outside the pit — game over
  else if (scene.ending && scene.ending_class === "bad") {
    trackForScene = "gameover.mp3";
  }
  // Neutral / regret endings — silence
  else if (scene.ending) {
    trackForScene = null;
  }

  if (trackForScene === null) {
    stopMusic();
  } else {
    playMusic(trackForScene, 0.35);
  }

  // Initialize demon HP when entering a fight scene for the first time
  if (scene.fight && state._currentFightScene !== sceneId) {
    state._currentFightScene = sceneId;
    state.pit_demon_hp = scene.demon_hp != null ? scene.demon_hp : 2;
    state.pit_demon_hp_max = state.pit_demon_hp;
    state.pit_fight_wrong = [];
  }

  let html = "";
  html += buildPitStatus();
  html += buildInventory();

  if (scene.sprite) {
    const spriteName = typeof scene.sprite === "function" ? scene.sprite(state) : scene.sprite;
    if (spriteName && SPRITES[spriteName]) {
      const flashClass = state._demonHitPending ? "demon-hit" : "";
      html += `<img id="demonSprite" class="pixel-art ${flashClass}" src="${SPRITES[spriteName]}" alt="">`;
      if (state._demonHitPending) state._demonHitPending = false;
    }
  } else if (scene.art) {
    const url = artToDataUrl(scene.art);
    if (url) html += `<img class="pixel-art" src="${url}" alt="">`;
  }

  // Demon HP bar below the sprite (fight scenes only)
  if (scene.fight) {
    let cells = "";
    for (let i = 0; i < state.pit_demon_hp_max; i++) {
      cells += `<div class="demon-hp-cell ${i < state.pit_demon_hp ? 'filled' : ''}"></div>`;
    }
    html += `<div class="demon-hp">${cells}</div>`;
  }

  // Gun overlay removed — it blocked the choice buttons


  if (scene.ending) {
    const cls = scene.ending_class ? ` ${scene.ending_class}` : "";
    html += `<div class="ending-label${cls}">— ${scene.ending_label || "The End"} —</div>`;
  }

  html += `<div class="scene-text">${escapeHtml(resolveText(scene.text))}</div>`;

  if (scene.input) {
    html += `
      <input type="text" class="text-input" id="textInput" placeholder="${escapeHtml(scene.input.placeholder || "")}" autocomplete="off" />
      <button class="submit-button" id="submitInput">Submit</button>
      <div class="input-error" id="inputError"></div>
    `;
    // Render choices alongside input (e.g., a "let me get back to you" escape option)
    if (scene.choices) {
      const visible = scene.choices.filter(isChoiceVisible);
      html += `<div class="choices">`;
      visible.forEach((c, i) => {
        const label = typeof c.text === "function" ? c.text(state) : c.text;
        html += `<button class="choice" data-idx="${i}">${escapeHtml(label)}</button>`;
      });
      html += `</div>`;
      scene._visibleCache = visible;
    }
  } else if (scene.ending) {
    const turns = state._turns || 0;
    const nearMisses = state._near_misses || 0;
    const turnsLabel = turns === 1 ? "1 turn" : `${turns} turns`;
    const missLabel = nearMisses === 1 ? "1 near-death experience" : `${nearMisses} near-death experiences`;
    html += `<div class="stats-block">
      <div class="stats-title">Final Report</div>
      <div class="stats-row"><span>Turns survived:</span><span>${turnsLabel}</span></div>
      <div class="stats-row"><span>Bullets dodged:</span><span>${missLabel}</span></div>
    </div>`;
    html += `<button class="restart" id="restartBtn">Play again</button>`;
  } else if (scene.choices) {
    let displayChoices;
    if (scene.fight) {
      // For fight scenes: show ALL choices (except those skipped by requires/unless/wrong-list),
      // but mark resource-zero ones as "spent" — clicking them damages the player
      displayChoices = scene.choices.filter(c => {
        if (c.requires) for (const k of c.requires) if (!state[k]) return false;
        if (c.unless) for (const k of c.unless) if (state[k]) return false;
        if (c.id && state.pit_fight_wrong && state.pit_fight_wrong.includes(c.id)) return false;
        return true;
      }).map(c => {
        // Determine if resource is depleted
        let isSpent = false;
        if (c.requires_count) {
          for (const k of c.requires_count) {
            if (!(state[k] > 0)) { isSpent = true; break; }
          }
        }
        return Object.assign({}, c, { spent: isSpent });
      });
    } else {
      displayChoices = scene.choices.filter(isChoiceVisible);
    }
    const visibleFinal = displayChoices;
    html += `<div class="choices">`;
    visibleFinal.forEach((c, i) => {
      const label = typeof c.text === "function" ? c.text(state) : c.text;
      const cls = c.spent ? "choice spent" : "choice";
      html += `<button class="${cls}" data-idx="${i}">${escapeHtml(label)}</button>`;
    });
    html += `</div>`;
    // Replace `visible` with the displayed set for later click-handler reference
    scene._visibleCache = visibleFinal;
  }

  if (!scene.ending) {
    html += `<a class="restart-link" id="restartLink">Restart story</a>`;
  }

  app.innerHTML = html;

  // Resolve a scene ID through any routing chain to its terminal scene
  function resolveTerminal(sceneId, depth) {
    depth = depth || 0;
    if (depth > 10) return null;
    const s = SCENES[sceneId];
    if (!s) return null;
    if (s.route) return resolveTerminal(s.route(state), depth + 1);
    return s;
  }

  if (scene.choices) {
    const visible = scene._visibleCache || scene.choices.filter(isChoiceVisible);
    // Check if any visible choice leads to a terminal ending
    const anyDeadly = visible.some(c => {
      if (!c.next || c.next === "self") return false;
      const t = resolveTerminal(c.next);
      return t && t.ending;
    });

    // Fight scenes: render timer bar at top of screen and start countdown
    let timerId = null;
    let timeoutId = null;
    // Always remove any leftover timer from previous scene
    const oldTimer = document.querySelector(".pit-timer");
    if (oldTimer) oldTimer.remove();
    if (scene.fight) {
      const timerEl = document.createElement("div");
      timerEl.className = "pit-timer";
      timerEl.innerHTML = `<div class="pit-timer-fill" id="timerFill" style="width:100%; transition: width ${scene.fight_seconds || 8}s linear;"></div>`;
      document.body.appendChild(timerEl);
      // Kick off animation on next frame
      requestAnimationFrame(() => {
        const fill = document.getElementById("timerFill");
        if (fill) fill.style.width = "0%";
      });
      // On timeout, treat as a wrong choice (wound)
      timeoutId = setTimeout(() => {
        applyFightWound(sceneId, null);
      }, (scene.fight_seconds || 8) * 1000);
    }

    function clearTimers() {
      if (timeoutId) clearTimeout(timeoutId);
      if (timerId) clearInterval(timerId);
    }

    function applyFightWound(currentSceneId, choiceData) {
      clearTimers();
      // Play hit sound
      playSfx("ow");
      flashDamage();
      state.pit_hp = Math.max(0, (state.pit_hp || 0) - 1);
      state._near_misses = (state._near_misses || 0) + 1;
      // Track this choice as already-wrong so we don't show it on retry
      if (choiceData && choiceData.id) {
        state.pit_fight_wrong = state.pit_fight_wrong || [];
        state.pit_fight_wrong.push(choiceData.id);
      }
      if (state.pit_hp <= 0) {
        render("ending_pit_doom_death");
        return;
      }
      // Re-render same scene (with wound state applied; wrong option filtered by isChoiceVisible)
      render(currentSceneId);
    }

    document.querySelectorAll(".choice").forEach((btn) => {
      btn.addEventListener("click", () => {
        const c = visible[parseInt(btn.dataset.idx)];
        clearTimers();
        // Play sound effect if specified
        if (c.sfx) playSfx(c.sfx);
        if (c.set) Object.assign(state, c.set);
        // Handle named actions
        if (c.action === "increment_mtg") {
          state.mtg_games_played = (state.mtg_games_played || 0) + 1;
        }
        // Pit fight resolution
        if (scene.fight) {
          // Check if user clicked a SPENT option (special case: still visible but at 0 uses)
          if (c.spent) {
            // Show "out of ammo" toast AND damage the player
            showAmmoToast(c);
            applyFightWound(sceneId, null);
            return;
          }
          if (c.correct) {
            // Determine damage to demon
            let dmg = c.instant_kill ? state.pit_demon_hp : 1;
            if (c.consumes) state[c.consumes] = Math.max(0, (state[c.consumes] || 0) - 1);
            state.pit_demon_hp = Math.max(0, state.pit_demon_hp - dmg);
            state._demonHitPending = true;
            if (state.pit_demon_hp > 0) {
              // Demon still alive — re-render same fight scene with reduced HP
              clearTimers();
              render(sceneId);
              return;
            } else {
              // Demon killed — clear fight state and advance
              state._currentFightScene = null;
              state.pit_fight_wrong = [];
            }
          } else {
            // Wrong choice — wound and consume the item
            if (c.consumes) state[c.consumes] = Math.max(0, (state[c.consumes] || 0) - 1);
            applyFightWound(sceneId, c);
            return;
          }
        }
        // Plumpy panic button — auto-kill the demon
        if (c.action === "plumpy_panic") {
          state.pit_plumpy_available = false;
          state.pit_demon_hp = 0;
          state._currentFightScene = null;
          state.pit_fight_wrong = [];
        }
        // Heal action
        if (c.action === "heal_one") {
          state.pit_hp = Math.min(state.pit_hp_max, (state.pit_hp || 0) + 1);
          if (c.consumes) state[c.consumes] = Math.max(0, (state[c.consumes] || 0) - 1);
          playSfx("drink");
        }
        // Count turns
        state._turns = (state._turns || 0) + 1;
        const target = (c.next === "self" || c.next == null) ? sceneId : c.next;
        const targetScene = resolveTerminal(target);
        if (anyDeadly && targetScene && !targetScene.ending) {
          state._near_misses = (state._near_misses || 0) + 1;
        }
        // Door open animation: brief delay before transition for visual feedback
        if (c.door_anim) {
          const doorImg = document.querySelector(".pixel-art");
          if (doorImg) {
            doorImg.style.transition = "transform 0.3s ease, opacity 0.3s ease";
            doorImg.style.transform = "scale(1.08)";
            doorImg.style.opacity = "0.5";
          }
          playSfx("hit");
          setTimeout(() => render(target), 500);
        } else {
          render(target);
        }
      });
    });
  }

  if (scene.ending) {
    document.getElementById("restartBtn").addEventListener("click", start);
  }

  if (scene.input) {
    const inputEl = document.getElementById("textInput");
    const submitEl = document.getElementById("submitInput");
    const errorEl = document.getElementById("inputError");

    const submit = () => {
      const raw = inputEl.value.trim().toLowerCase().replace(/[\s,]+/g, "");
      const accepted = (scene.input.accept || []).map(s => s.toLowerCase().replace(/[\s,]+/g, ""));
      if (accepted.includes(raw)) {
        if (scene.input.set) Object.assign(state, scene.input.set);
        render(scene.input.success_next);
      } else {
        const errMsg = typeof scene.input.error === "function" ? scene.input.error(state) : (scene.input.error || "That's not it. Try again.");
        errorEl.textContent = errMsg;
      }
    };

    submitEl.addEventListener("click", submit);
    inputEl.addEventListener("keypress", (e) => { if (e.key === "Enter") submit(); });
    setTimeout(() => inputEl.focus(), 100);
  }

  const restartLink = document.getElementById("restartLink");
  if (restartLink) restartLink.addEventListener("click", start);

  window.scrollTo(0, 0);
}

function start() {
  stopMusic();
  resetState();
  render(START_SCENE);
}

start();
</script>
</body>
</html>
