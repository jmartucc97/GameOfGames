<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Story</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f0f12;
    color: #e8e8ea;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 20px 40px;
    line-height: 1.6;
  }
  .container { width: 100%; max-width: 600px; flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .inventory {
    font-size: 0.78rem;
    color: #6a6a72;
    text-align: center;
    margin-bottom: 16px;
    letter-spacing: 0.02em;
    animation: fadeIn 0.4s ease;
  }
  .inventory-label { color: #4a4a52; }
  .pixel-art {
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    width: 100%;
    max-width: 280px;
    height: auto;
    display: block;
    margin: 0 auto 24px;
    background: #16161c;
    border-radius: 8px;
    padding: 12px;
    animation: fadeIn 0.4s ease;
  }
  .scene-text {
    font-size: 1.1rem;
    margin-bottom: 28px;
    white-space: pre-wrap;
    animation: fadeIn 0.4s ease;
  }
  .choices { display: flex; flex-direction: column; gap: 12px; animation: fadeIn 0.4s ease 0.1s both; }
  .choice {
    background: #1c1c22;
    border: 1px solid #2a2a32;
    color: #e8e8ea;
    padding: 16px 18px;
    border-radius: 12px;
    font-size: 1rem;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    transition: background 0.15s, transform 0.05s;
    line-height: 1.4;
  }
  .choice:hover { background: #25252e; }
  .choice:active { transform: scale(0.98); background: #2e2e38; }
  .ending-label {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #888;
    margin-bottom: 16px;
    text-align: center;
  }
  .ending-label.win { color: #5aaa4a; }
  .ending-label.bad { color: #c03a3a; }
  .restart {
    background: #e8e8ea;
    color: #0f0f12;
    border: none;
    padding: 16px 24px;
    border-radius: 12px;
    font-size: 1rem;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    margin-top: 16px;
    width: 100%;
  }
  .restart:active { transform: scale(0.98); }
  .text-input {
    background: #1c1c22;
    border: 1px solid #2a2a32;
    color: #e8e8ea;
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 1rem;
    font-family: inherit;
    width: 100%;
    margin-bottom: 12px;
  }
  .text-input:focus { outline: none; border-color: #4a4a52; }
  .submit-button {
    background: #e8e8ea;
    color: #0f0f12;
    border: none;
    padding: 14px 20px;
    border-radius: 12px;
    font-size: 1rem;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
  }
  .submit-button:active { transform: scale(0.98); }
  .input-error {
    color: #c03a3a;
    font-size: 0.9rem;
    margin-top: 12px;
    text-align: center;
    min-height: 1.2em;
  }
  .restart-link {
    display: block;
    text-align: center;
    margin-top: 28px;
    font-size: 0.78rem;
    color: #444;
    text-decoration: underline;
    cursor: pointer;
  }
  .restart-link:hover { color: #777; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="container">
  <div id="app"></div>

// =================================================
// ENGINE
// =================================================

let state = {};

function resetState() {
  state = {
    has_flashlight: false,
    has_note: false,
    has_pit: false,
    has_bananas: false,
    reactor_powered: false,
    has_tube: false,
    has_hard_treats: false,
    has_catnip: false,
    searched_close: false,
    searched_middle: false,
    searched_back: false,
    wish_used: false,
    met_plumpy: false,
    investigated_noise: false,
    mtg_played: false,
  };
}

const app = document.getElementById("app");

function artToDataUrl(artLines) {
  if (!artLines || !artLines.length) return null;
  const width = Math.max(...artLines.map(l => l.length));
  const height = artLines.length;
  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext("2d");
  for (let y = 0; y < height; y++) {
    const line = artLines[y];
    for (let x = 0; x < line.length; x++) {
      const ch = line[x];
      const color = PALETTE[ch];
      if (color && color !== "transparent") {
        ctx.fillStyle = color;
        ctx.fillRect(x, y, 1, 1);
      }
    }
  }
  return canvas.toDataURL();
}

function buildInventory() {
  const items = [];
  if (state.has_flashlight) items.push("flashlight");
  if (state.has_note) items.push("note");
  if (state.has_pit) items.push("bottomless pit");
  if (state.has_bananas) items.push("10²¹ bananas");
  if (state.has_tube) items.push("treat tube");
  if (state.has_hard_treats) items.push("hard treats");
  if (state.has_catnip) items.push("catnip");
  if (!items.length) return "";
  return `<div class="inventory"><span class="inventory-label">Carrying:</span> ${items.join(" · ")}</div>`;
}

function isChoiceVisible(c) {
  if (c.requires) for (const k of c.requires) if (!state[k]) return false;
  if (c.unless) for (const k of c.unless) if (state[k]) return false;
  return true;
}

function resolveText(t) {
  return typeof t === "function" ? t(state) : t;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function render(sceneId) {
  let scene = SCENES[sceneId];

  // Handle routing scenes
  while (scene && scene.route) {
    const next = scene.route(state);
    scene = SCENES[next];
    sceneId = next;
  }

  if (!scene) {
    app.innerHTML = `<div class="scene-text">Error: scene "${sceneId}" not found.</div>`;
    return;
  }

  if (scene.set) Object.assign(state, scene.set);

  let html = "";
  html += buildInventory();

  if (scene.art) {
    const url = artToDataUrl(scene.art);
    if (url) html += `<img class="pixel-art" src="${url}" alt="">`;
  }

  if (scene.ending) {
    const cls = scene.ending_class ? ` ${scene.ending_class}` : "";
    html += `<div class="ending-label${cls}">— ${scene.ending_label || "The End"} —</div>`;
  }

  html += `<div class="scene-text">${escapeHtml(resolveText(scene.text))}</div>`;

  if (scene.input) {
    html += `
      <input type="text" class="text-input" id="textInput" placeholder="${escapeHtml(scene.input.placeholder || "")}" autocomplete="off" />
      <button class="submit-button" id="submitInput">Submit</button>
      <div class="input-error" id="inputError"></div>
    `;
  } else if (scene.ending) {
    html += `<button class="restart" id="restartBtn">Play again</button>`;
  } else if (scene.choices) {
    const visible = scene.choices.filter(isChoiceVisible);
    html += `<div class="choices">`;
    visible.forEach((c, i) => {
      html += `<button class="choice" data-idx="${i}">${escapeHtml(c.text)}</button>`;
    });
    html += `</div>`;
  }

  if (!scene.ending) {
    html += `<a class="restart-link" id="restartLink">Restart story</a>`;
  }

  app.innerHTML = html;

  // Attach handlers
  if (scene.choices && !scene.input) {
    const visible = scene.choices.filter(isChoiceVisible);
    document.querySelectorAll(".choice").forEach((btn) => {
      btn.addEventListener("click", () => {
        const c = visible[parseInt(btn.dataset.idx)];
        if (c.set) Object.assign(state, c.set);
        render(c.next);
      });
    });
  }

  if (scene.ending) {
    document.getElementById("restartBtn").addEventListener("click", start);
  }

  if (scene.input) {
    const inputEl = document.getElementById("textInput");
    const submitEl = document.getElementById("submitInput");
    const errorEl = document.getElementById("inputError");

    const submit = () => {
      const raw = inputEl.value.trim().toLowerCase().replace(/[\s,]+/g, "");
      const accepted = (scene.input.accept || []).map(s => s.toLowerCase().replace(/[\s,]+/g, ""));
      if (accepted.includes(raw)) {
        if (scene.input.set) Object.assign(state, scene.input.set);
        render(scene.input.success_next);
      } else {
        errorEl.textContent = scene.input.error || "That's not it. Try again.";
      }
    };

    submitEl.addEventListener("click", submit);
    inputEl.addEventListener("keypress", (e) => { if (e.key === "Enter") submit(); });
    setTimeout(() => inputEl.focus(), 100);
  }

  const restartLink = document.getElementById("restartLink");
  if (restartLink) restartLink.addEventListener("click", start);

  window.scrollTo(0, 0);
}

function start() {
  resetState();
  render(START_SCENE);
}

start();
