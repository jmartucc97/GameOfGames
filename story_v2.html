<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Story</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f0f12;
    color: #e8e8ea;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 20px 40px;
    line-height: 1.6;
  }
  .container { width: 100%; max-width: 600px; flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .inventory {
    font-size: 0.78rem;
    color: #6a6a72;
    text-align: center;
    margin-bottom: 16px;
    letter-spacing: 0.02em;
    animation: fadeIn 0.4s ease;
  }
  .inventory-label { color: #4a4a52; }
  .pixel-art {
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    width: 100%;
    max-width: 280px;
    height: auto;
    display: block;
    margin: 0 auto 24px;
    background: #16161c;
    border-radius: 8px;
    padding: 12px;
    animation: fadeIn 0.4s ease;
  }
  .scene-text {
    font-size: 1.1rem;
    margin-bottom: 28px;
    white-space: pre-wrap;
    animation: fadeIn 0.4s ease;
  }
  .choices { display: flex; flex-direction: column; gap: 12px; animation: fadeIn 0.4s ease 0.1s both; }
  .choice {
    background: #1c1c22;
    border: 1px solid #2a2a32;
    color: #e8e8ea;
    padding: 16px 18px;
    border-radius: 12px;
    font-size: 1rem;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    transition: background 0.15s, transform 0.05s;
    line-height: 1.4;
  }
  .choice:hover { background: #25252e; }
  .choice:active { transform: scale(0.98); background: #2e2e38; }
  .ending-label {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #888;
    margin-bottom: 16px;
    text-align: center;
  }
  .ending-label.win { color: #5aaa4a; }
  .ending-label.bad { color: #c03a3a; }
  .restart {
    background: #e8e8ea;
    color: #0f0f12;
    border: none;
    padding: 16px 24px;
    border-radius: 12px;
    font-size: 1rem;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    margin-top: 16px;
    width: 100%;
  }
  .restart:active { transform: scale(0.98); }
  .text-input {
    background: #1c1c22;
    border: 1px solid #2a2a32;
    color: #e8e8ea;
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 1rem;
    font-family: inherit;
    width: 100%;
    margin-bottom: 12px;
  }
  .text-input:focus { outline: none; border-color: #4a4a52; }
  .submit-button {
    background: #e8e8ea;
    color: #0f0f12;
    border: none;
    padding: 14px 20px;
    border-radius: 12px;
    font-size: 1rem;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
  }
  .submit-button:active { transform: scale(0.98); }
  .input-error {
    color: #c03a3a;
    font-size: 0.9rem;
    margin-top: 12px;
    text-align: center;
    min-height: 1.2em;
  }
  .restart-link {
    display: block;
    text-align: center;
    margin-top: 28px;
    font-size: 0.78rem;
    color: #444;
    text-decoration: underline;
    cursor: pointer;
  }
  .restart-link:hover { color: #777; }
  .stats-block {
    background: #16161c;
    border: 1px solid #2a2a32;
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 16px;
    animation: fadeIn 0.4s ease 0.2s both;
  }
  .stats-title {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #6a6a72;
    margin-bottom: 10px;
    text-align: center;
  }
  .stats-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.92rem;
    color: #c8c8ca;
    padding: 4px 0;
  }
  .stats-row span:first-child { color: #888; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>

<div class="container">
  <div id="app"></div>
</div>

function pileChoices(pileItems, returnScene) {
  const choices = [];
  // Take each item (auto-swaps - clears other items in pile, sets this one)
  pileItems.forEach(item => {
    const set = {};
    pileItems.forEach(other => { set[other.flag] = (other.id === item.id); });
    choices.push({
      text: `Take the ${item.label}`,
      next: returnScene === "self" ? null : returnScene,
      set: set,
      unless: [item.flag]
    });
  });
  // Put back current item
  pileItems.forEach(item => {
    const set = {};
    set[item.flag] = false;
    choices.push({
      text: `Put back the ${item.label}`,
      set: set,
      requires: [item.flag]
    });
  });
  return choices;
}

// =================================================
// ENGINE
// =================================================

let state = {};

function resetState() {
  state = {
    has_flashlight: false,
    has_ssn: false,
    has_passport: false,
    has_speaker: false,
    has_note: false,
    has_zynns: false,
    has_plums: false,
    has_pit: false,
    has_bananas: false,
    has_tube: false,
    has_hard_treats: false,
    has_catnip: false,
    reactor_powered: false,
    wish_used: false,
    met_plumpy: false,
    investigated_noise: false,
    mtg_played: false,
    tiki_tried: false,
    tiki_taken: false,
    has_mtg_deck: false,
    has_charger: false,
    has_kalashnikov: false,
    mtg_games_played: 0,
    john_appeared: false,
    john_handled: false,
    samara_eligible_john_call: false,
    samara_round: 0,
    samara_spawned: false,
    samara_resolved: false,
    plumpy_lit_room: false,
    fracking_initiated: false,
    frack_q1_wrong: false,
    frack_q2_wrong: false,
    frack_q3_wrong: false,
    frack_q1_pick: null,
    frack_q2_pick: null,
    frack_q3_pick: null,
    _turns: 0,
    _near_misses: 0,
  };
}

const app = document.getElementById("app");

function artToDataUrl(artLines) {
  if (!artLines || !artLines.length) return null;
  const width = Math.max(...artLines.map(l => l.length));
  const height = artLines.length;
  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext("2d");
  for (let y = 0; y < height; y++) {
    const line = artLines[y];
    for (let x = 0; x < line.length; x++) {
      const ch = line[x];
      const color = PALETTE[ch];
      if (color && color !== "transparent") {
        ctx.fillStyle = color;
        ctx.fillRect(x, y, 1, 1);
      }
    }
  }
  return canvas.toDataURL();
}

function buildInventory() {
  const items = [];
  if (state.has_flashlight) items.push("flashlight");
  if (state.has_ssn) items.push("SSN card");
  if (state.has_passport) items.push("passport");
  if (state.has_speaker) items.push("speaker");
  if (state.has_note) items.push("scrap of paper");
  if (state.has_zynns) items.push("Zynns");
  if (state.has_plums) items.push("plums");
  if (state.has_mtg_deck) items.push("MtG deck");
  if (state.has_charger) items.push("micro USB charger");
  if (state.has_kalashnikov) items.push("Kalashnikov");
  if (state.has_bananas) items.push("10²¹ bananas");
  if (state.has_tube) items.push("treat tube");
  if (state.has_hard_treats) items.push("hard treats");
  if (state.has_catnip) items.push("catnip");
  if (!items.length) return "";
  return `<div class="inventory"><span class="inventory-label">Carrying:</span> ${items.join(" · ")}</div>`;
}

function isChoiceVisible(c) {
  if (c.requires) for (const k of c.requires) if (!state[k]) return false;
  if (c.unless) for (const k of c.unless) if (state[k]) return false;
  return true;
}

function resolveText(t) {
  return typeof t === "function" ? t(state) : t;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function render(sceneId) {
  let scene = SCENES[sceneId];

  while (scene && scene.route) {
    const next = scene.route(state);
    scene = SCENES[next];
    sceneId = next;
  }

  if (!scene) {
    app.innerHTML = `<div class="scene-text">Error: scene "${sceneId}" not found.</div>`;
    return;
  }

  if (scene.set) Object.assign(state, scene.set);

  let html = "";
  html += buildInventory();

  if (scene.sprite && SPRITES[scene.sprite]) {
    html += `<img class="pixel-art" src="${SPRITES[scene.sprite]}" alt="">`;
  } else if (scene.art) {
    const url = artToDataUrl(scene.art);
    if (url) html += `<img class="pixel-art" src="${url}" alt="">`;
  }

  if (scene.ending) {
    const cls = scene.ending_class ? ` ${scene.ending_class}` : "";
    html += `<div class="ending-label${cls}">— ${scene.ending_label || "The End"} —</div>`;
  }

  html += `<div class="scene-text">${escapeHtml(resolveText(scene.text))}</div>`;

  if (scene.input) {
    html += `
      <input type="text" class="text-input" id="textInput" placeholder="${escapeHtml(scene.input.placeholder || "")}" autocomplete="off" />
      <button class="submit-button" id="submitInput">Submit</button>
      <div class="input-error" id="inputError"></div>
    `;
  } else if (scene.ending) {
    const turns = state._turns || 0;
    const nearMisses = state._near_misses || 0;
    const turnsLabel = turns === 1 ? "1 turn" : `${turns} turns`;
    const missLabel = nearMisses === 1 ? "1 near-death experience" : `${nearMisses} near-death experiences`;
    html += `<div class="stats-block">
      <div class="stats-title">Final Report</div>
      <div class="stats-row"><span>Turns survived:</span><span>${turnsLabel}</span></div>
      <div class="stats-row"><span>Bullets dodged:</span><span>${missLabel}</span></div>
    </div>`;
    html += `<button class="restart" id="restartBtn">Play again</button>`;
  } else if (scene.choices) {
    const visible = scene.choices.filter(isChoiceVisible);
    html += `<div class="choices">`;
    visible.forEach((c, i) => {
      html += `<button class="choice" data-idx="${i}">${escapeHtml(c.text)}</button>`;
    });
    html += `</div>`;
  }

  if (!scene.ending) {
    html += `<a class="restart-link" id="restartLink">Restart story</a>`;
  }

  app.innerHTML = html;

  // Resolve a scene ID through any routing chain to its terminal scene
  function resolveTerminal(sceneId, depth) {
    depth = depth || 0;
    if (depth > 10) return null;
    const s = SCENES[sceneId];
    if (!s) return null;
    if (s.route) return resolveTerminal(s.route(state), depth + 1);
    return s;
  }

  if (scene.choices && !scene.input) {
    const visible = scene.choices.filter(isChoiceVisible);
    // Check if any visible choice leads to a terminal ending
    const anyDeadly = visible.some(c => {
      if (!c.next || c.next === "self") return false;
      const t = resolveTerminal(c.next);
      return t && t.ending;
    });
    document.querySelectorAll(".choice").forEach((btn) => {
      btn.addEventListener("click", () => {
        const c = visible[parseInt(btn.dataset.idx)];
        if (c.set) Object.assign(state, c.set);
        // Handle named actions (e.g. mtg counter)
        if (c.action === "increment_mtg") {
          state.mtg_games_played = (state.mtg_games_played || 0) + 1;
        }
        // Count turns
        state._turns = (state._turns || 0) + 1;
        // Count near-miss: there was a deadly option, but THIS choice doesn't end the game
        const target = (c.next === "self" || c.next == null) ? sceneId : c.next;
        const targetScene = resolveTerminal(target);
        if (anyDeadly && targetScene && !targetScene.ending) {
          state._near_misses = (state._near_misses || 0) + 1;
        }
        render(target);
      });
    });
  }

  if (scene.ending) {
    document.getElementById("restartBtn").addEventListener("click", start);
  }

  if (scene.input) {
    const inputEl = document.getElementById("textInput");
    const submitEl = document.getElementById("submitInput");
    const errorEl = document.getElementById("inputError");

    const submit = () => {
      const raw = inputEl.value.trim().toLowerCase().replace(/[\s,]+/g, "");
      const accepted = (scene.input.accept || []).map(s => s.toLowerCase().replace(/[\s,]+/g, ""));
      if (accepted.includes(raw)) {
        if (scene.input.set) Object.assign(state, scene.input.set);
        render(scene.input.success_next);
      } else {
        const errMsg = typeof scene.input.error === "function" ? scene.input.error(state) : (scene.input.error || "That's not it. Try again.");
        errorEl.textContent = errMsg;
      }
    };

    submitEl.addEventListener("click", submit);
    inputEl.addEventListener("keypress", (e) => { if (e.key === "Enter") submit(); });
    setTimeout(() => inputEl.focus(), 100);
  }

  const restartLink = document.getElementById("restartLink");
  if (restartLink) restartLink.addEventListener("click", start);

  window.scrollTo(0, 0);
}

function start() {
  resetState();
  render(START_SCENE);
}

start();
</script>
